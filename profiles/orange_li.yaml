version: 3
kind: carrier_bundle
id: apple_orange_li
bundle: Orange_li.bundle
supported_plmns:
    - "29502"
common: {}
plmn_overrides:
    "29502":
        ims:
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
