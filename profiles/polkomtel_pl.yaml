version: 3
kind: carrier_bundle
id: apple_polkomtel_pl
bundle: Polkomtel_pl.bundle
supported_plmns:
    - "26001"
plmn_overrides:
    "26001":
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: required
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
