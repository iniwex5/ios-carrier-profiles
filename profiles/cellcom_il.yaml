version: 3
kind: carrier_bundle
id: apple_cellcom_il
bundle: Cellcom_il.bundle
supported_plmns:
    - "42502"
common: {}
plmn_overrides:
    "42502":
        apple:
            carrier_entitlements:
                supported_entitlements: 13328
        entitlement:
            entitlement_url: https://esim-es-open-prod-cellcom.esimcloud.net/cellcom/prod/executeAppleActions
        ims:
            apn: ims
            ip_stack: ipv6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                local_identifier_type: IDUserFQDN
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                contact:
                    always_add_sip_instance: false
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 10
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
