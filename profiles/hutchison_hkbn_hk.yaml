version: 3
kind: carrier_bundle
id: apple_hutchison_hkbn_hk
bundle: Hutchison_HKBN_hk.bundle
supported_plmns:
    - "45403"
common: {}
plmn_overrides:
    "45403":
        apple:
            carrier_entitlements:
                supported_entitlements: 1
        entitlement:
            entitlement_url: https://device.three.com.hk:8181/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: wlan.three.com.hk
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
