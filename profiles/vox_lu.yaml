version: 3
kind: carrier_bundle
id: apple_vox_lu
bundle: VOX_lu.bundle
supported_plmns:
    - "27099"
plmn_overrides:
    "27099":
        apple:
            carrier_entitlements:
                supported_entitlements: 8401
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://aes.orange.lu:443/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
            ike:
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: 5
                          esn: auto
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: false
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - 5XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                sip_timers:
                    InviteResponseTimeout: 2000
            media:
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
