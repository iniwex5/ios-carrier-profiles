version: 3
kind: carrier_bundle
id: apple_mobistar_be
bundle: Mobistar_be.bundle
supported_plmns:
    - "20610"
common: {}
plmn_overrides:
    "20610":
        apple:
            carrier_entitlements:
                supported_entitlements: 4202705
        entitlement:
            entitlement_url: https://aes.orange.be:443/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 5
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: modp1536
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - 5XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
