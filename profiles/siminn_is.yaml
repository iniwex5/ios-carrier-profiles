version: 3
kind: carrier_bundle
id: apple_siminn_is
bundle: Siminn_is.bundle
supported_plmns:
    - "27401"
plmn_overrides:
    "27401":
        apple:
            carrier_entitlements:
                supported_entitlements: 5121
        e911:
            over_itech_supported: false
        entitlement:
            entitlement_url: https://aes.siminn.is
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                early_media_needs_header: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
