version: 3
kind: carrier_bundle
id: apple_cellularsouth_lte_us
bundle: CellularSouth_LTE_US.bundle
supported_plmns:
    - "20404"
    - "311230"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4205721
    entitlement:
        entitlement_url: https://DEG.CSPIRE.COM/ium-OEMInterface/servlet/IUMServlet
    ims:
        domain: ims.mnc230.mcc311.3gppnetwork.org
        epdg:
            address: ePDG.VoWifi.Cspire.com
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 86400
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            local_identifier_type: IDUserFQDN
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        impi_format: imsi@carrierDomain
        impu_format: imsi@carrierDomain
        media:
            rtcp_inactivity_seconds: 20
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            max_udp_message_size: 1200
            preconditions: unsupported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
