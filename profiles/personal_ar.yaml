version: 3
kind: carrier_bundle
id: apple_personal_ar
bundle: Personal_ar.bundle
supported_plmns:
    - "72234"
    - "722341"
common:
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        domain: ims.mnc034.mcc722.3gppnetwork.org
        epdg:
            address: epdg.epc.mnc034.mcc722.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc034.mcc$mcc.3gppnetwork.org
            nat_keepalive_enabled: false
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        impi_format: imsi@carrierDomain
        impu_format: imsi@carrierDomain
        ip_stack: ipv4v6
        media:
            remote_rtcp_deactivation: true
            rtcp_inactivity_seconds: 25
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.srvcc-alerting
                always_add_sip_instance: true
            early_media_needs_header: false
            max_udp_message_size: 1300
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            support_p_early_media: false
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
