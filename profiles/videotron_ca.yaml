version: 3
kind: carrier_bundle
id: apple_videotron_ca
bundle: Videotron_ca.bundle
supported_plmns:
    - "20404"
    - "302500"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4195505
    entitlement:
        entitlement_url: https://ses.videotron.com
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            sa_lifetime_seconds: 86400
        ip_stack: ipv6
        register:
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "414"
                    - "499"
                    - "606"
            preconditions: supported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "20404":
        ims:
            epdg:
                address: epdg.epc.mnc500.mcc302.pub.3gppnetwork.org
