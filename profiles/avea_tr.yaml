version: 3
kind: carrier_bundle
id: apple_avea_tr
bundle: AVEA_tr.bundle
supported_plmns:
    - "28603"
    - "28604"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 1233
    entitlement:
        entitlement_url: https://es.turktelekom.com.tr/entitlement/
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 86400
            nat_keepalive_enabled: false
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        ip_stack: ipv4v6
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
            preconditions: supported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "28604":
        ims:
            epdg:
                address: epdg.epc.mnc003.mcc286.pub.3gppnetwork.org
