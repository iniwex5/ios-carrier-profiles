version: 3
kind: carrier_bundle
id: apple_avea_tr
bundle: AVEA_tr.bundle
supported_plmns:
    - "28603"
    - "28604"
common:
    apns:
        - apn: internet
          type_mask: 32817
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: MMS
          type_mask: 4
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4v6
          support_switch_over: true
          support_5g_sa_handover: true
          use_network_mtu: true
    apple:
        carrier_entitlements:
            supported_entitlements: 9425
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://es.turktelekom.com.tr/entitlement/
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc003.mcc286.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      lifetime_seconds: 86400
            nat_keepalive_enabled: false
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
        ip_stack: ipv4v6
        media:
            codecs:
                - payload_type: 109
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=2
            evs_hard_bw_limit: nb-swb
            preferred_amr_wb_mode: 8
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
