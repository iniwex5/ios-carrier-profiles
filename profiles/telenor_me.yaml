version: 3
kind: carrier_bundle
id: apple_telenor_me
bundle: Telenor_me.bundle
supported_plmns:
    - "29701"
plmn_overrides:
    "29701":
        apns:
            - apn: internet
              type_mask: 32817
            - apn: mms
              username: mms
              password: mms
              type_mask: 4
        apple:
            carrier_entitlements:
                supported_entitlements: 5121
        entitlement:
            entitlement_url: https://des.1.me/entitlement
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
