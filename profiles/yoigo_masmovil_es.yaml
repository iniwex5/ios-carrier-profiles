version: 3
kind: carrier_bundle
id: apple_yoigo_masmovil_es
bundle: Yoigo_Masmovil_es.bundle
supported_plmns:
    - "21404"
plmn_overrides:
    "21404":
        apns:
            - apn: internet
              type_mask: 32817
        apple:
            carrier_entitlements:
                supported_entitlements: 4194305
        entitlement:
            entitlement_url: https://aes.orange.es/core/v2
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                early_media_needs_header: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER
                          params:
                            - +g.3gpp.accesstype="cellular2"
            media:
                codecs:
                    - payload_type: 96
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=swb
                    - payload_type: 97
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb
                rtcp_inactivity_seconds: 30
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
