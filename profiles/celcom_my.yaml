version: 3
kind: carrier_bundle
id: apple_celcom_my
bundle: Celcom_my.bundle
supported_plmns:
    - "50219"
plmn_overrides:
    "50219":
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://es.celcom.com.my/
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "500"
                        - "503"
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                sip_timers:
                    D: 128000
                    F: 0
                    T1: 2000
                    T2: 16000
                    T4: 17000
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
