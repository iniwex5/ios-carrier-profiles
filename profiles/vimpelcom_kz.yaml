version: 3
kind: carrier_bundle
id: apple_vimpelcom_kz
bundle: VimpelCom_kz.bundle
supported_plmns:
    - "40101"
common: {}
plmn_overrides:
    "40101":
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
