version: 3
kind: carrier_bundle
id: apple_trueh_th
bundle: TrueH_th.bundle
supported_plmns:
    - "52000"
    - "52004"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 11457
    e911:
        emergency_urns:
            "112": urn:service:sos.police
            "1669": urn:service:sos.ambulance
            "191": urn:service:sos.police
            "199": urn:service:sos.fire
            "911": urn:service:sos.police
        over_itech_supported: true
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://iquery.truecorp.co.th/iquery
    ims:
        apn: ims
        domain: ims.mnc004.mcc520.3gppnetwork.org
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha512
                      rekey_pfs_group: modp2048
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha512
                  prf:
                    - sha512
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        ip_stack: ipv4v6
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "52000":
        ims:
            epdg:
                address: epdg.epc.mnc004.mcc520.pub.3gppnetwork.org
