version: 3
kind: carrier_bundle
id: apple_viva_bh
bundle: Viva_bh.bundle
supported_plmns:
    - "42001"
    - "42604"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 13313
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://appes.stc.com.bh/apple
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.epc.mnc004.mcc426.pub.stc.com.bh
                  ip_family: ipv4
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      lifetime_seconds: 86400
            nat_keepalive_enabled: true
            sa_lifetime_seconds: 86400
        ip_stack: ipv4
        media:
            rtcp_inactivity_seconds: 36000
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 15
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 5XX
                    - 6XX
            early_media_needs_header: true
            max_udp_message_size: 1500
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 10000
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
