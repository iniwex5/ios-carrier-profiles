version: 3
kind: carrier_bundle
id: apple_orange_re
bundle: Orange_re.bundle
supported_plmns:
    - "64700"
plmn_overrides:
    "64700":
        apns:
            - apn: orangerun
              username: orange
              password: orange
              type_mask: 51
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
            - apn: orangerun.acte
              username: orange
              password: orange
              type_mask: 4
              tech_type_mask: 4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4
              support_switch_over: true
              use_network_mtu: true
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4
              allow_no_dns: 1
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                address: epdg.epc.mnc000.mcc647.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                remote_identifier_type: KeyID
                validate_remote_certificate: false
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - 5XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - text
                sip_timers:
                    InviteResponseTimeout: 3000
            media:
                codecs:
                    - payload_type: 96
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=swb
                    - payload_type: 97
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
