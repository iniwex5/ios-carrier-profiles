version: 3
kind: carrier_bundle
id: apple_movistar_cl
bundle: movistar_cl.bundle
supported_plmns:
    - "21407"
    - "73002"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 9233
    entitlement:
        entitlement_url: https://Entitlement.Movistar.cl/entitlement/
    ims:
        apn: ims
        media:
            rtp_inactivity_seconds: 10
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: false
            csfb_on:
                - method: INVITE
                  statuses:
                    - 5XX
                    - 6XX
            preconditions: supported
            support_p_early_media: true
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
