version: 3
kind: carrier_bundle
id: apple_tigo_bo
bundle: Tigo_bo.bundle
supported_plmns:
    - "73603"
plmn_overrides:
    "73603":
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 30
                rtcp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: false
