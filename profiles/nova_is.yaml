version: 3
kind: carrier_bundle
id: apple_nova_is
bundle: Nova_is.bundle
supported_plmns:
    - "27411"
    - "22201"
common:
    apns:
        - apn: net.nova.is
          type_mask: 1081393
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          support_switch_over: false
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4
          support_switch_over: true
        - apn: mms.nova.is
          type_mask: 4
          tech_type_mask: 4
          allowed_ip_stack: ipv4
          support_switch_over: false
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
          allow_no_dns: 1
    apple:
        carrier_entitlements:
            supported_entitlements: 13313
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://rsp-es-prod.sip.is
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc011.mcc274.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha256
                      rekey_pfs_group: 2
                      esn: auto
                      lifetime_seconds: 86400
            nat_keepalive_enabled: true
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 2
                  lifetime_seconds: 86400
        ip_stack: ipv4
        media:
            codecs:
                - payload_type: 106
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=0
            evs_hard_bw_limit: nb-swb
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            early_media_needs_header: true
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
