version: 3
kind: carrier_bundle
id: apple_nova_is
bundle: Nova_is.bundle
supported_plmns:
    - "22201"
    - "27411"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 13313
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://rsp-es-prod.sip.is
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      rekey_pfs_group: modp1024
                      lifetime_seconds: 86400
            nat_keepalive_enabled: true
            sa_lifetime_seconds: 86400
        ip_stack: ipv4
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            early_media_needs_header: true
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
plmn_overrides:
    "22201":
        ims:
            epdg:
                address: epdg.epc.mnc011.mcc274.pub.3gppnetwork.org
