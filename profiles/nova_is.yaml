version: 3
kind: carrier_bundle
id: apple_nova_is
bundle: Nova_is.bundle
supported_plmns:
    - "22201"
    - "27411"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 13313
    entitlement:
        entitlement_url: https://rsp-es-prod.sip.is
    ims:
        apn: ims
        ike:
            nat_keepalive_enabled: true
            sa_lifetime_seconds: 86400
        ip_stack: ipv4
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            preconditions: unsupported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "22201":
        ims:
            epdg:
                address: epdg.epc.mnc011.mcc274.pub.3gppnetwork.org
