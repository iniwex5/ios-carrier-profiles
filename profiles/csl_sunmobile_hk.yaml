version: 3
kind: carrier_bundle
id: apple_csl_sunmobile_hk
bundle: CSL_SunMobile_hk.bundle
supported_plmns:
    - "45400"
plmn_overrides:
    "45400":
        apple:
            carrier_entitlements:
                supported_entitlements: 1041
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://sdeweb.hkcsl.com/acme/api/
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 2000
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
