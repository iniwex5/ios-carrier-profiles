version: 3
kind: carrier_bundle
id: apple_csl_sunmobile_hk
bundle: CSL_SunMobile_hk.bundle
supported_plmns:
    - "45400"
common: {}
plmn_overrides:
    "45400":
        apple:
            carrier_entitlements:
                supported_entitlements: 1041
        entitlement:
            entitlement_url: https://sdeweb.hkcsl.com/acme/api/
        ims:
            apn: ims
            ip_stack: ipv6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 2000
                preconditions: unsupported
                support_p_early_media: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
