version: 3
kind: carrier_bundle
id: apple_movistar_ar
bundle: movistar_ar.bundle
supported_plmns:
    - "21407"
    - "72207"
    - "722070"
common:
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 25
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 10
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.srvcc-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
            early_media_needs_header: false
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
