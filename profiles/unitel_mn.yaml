version: 3
kind: carrier_bundle
id: apple_unitel_mn
bundle: Unitel_mn.bundle
supported_plmns:
    - "42888"
plmn_overrides:
    "42888":
        apns:
            - apn: net
              type_mask: 32817
              allowed_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4
            - apn: XCAP
              type_mask: 1048576
              allowed_ip_stack: ipv4
        apple:
            carrier_entitlements:
                supported_entitlements: 1
        entitlement:
            entitlement_url: https://ios.es.unitel.mn
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: false
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.mid-call
            media:
                codecs:
                    - payload_type: 106
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=nb-swb
                rtcp_inactivity_seconds: 36000
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
