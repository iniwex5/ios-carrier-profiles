version: 3
kind: carrier_bundle
id: apple_proximus_be
bundle: Proximus_be.bundle
supported_plmns:
    - "20601"
common: {}
plmn_overrides:
    "20601":
        apple:
            carrier_entitlements:
                supported_entitlements: 8193
        entitlement:
            entitlement_url: https://prod.ses.proximus.be:443
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16385
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
