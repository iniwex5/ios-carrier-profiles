version: 3
kind: carrier_bundle
id: apple_du_ae
bundle: du_ae.bundle
supported_plmns:
    - "42403"
plmn_overrides:
    "42403":
        apple:
            carrier_entitlements:
                supported_entitlements: 41985
        entitlement:
            entitlement_url: https://es.du.ae/entitlement/
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 10000
            media:
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                remote_rtcp_deactivation: true
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
