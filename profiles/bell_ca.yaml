version: 3
kind: carrier_bundle
id: apple_bell_ca
bundle: Bell_ca.bundle
supported_plmns:
    - "302610"
    - "302630"
    - "302640"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4205777
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://egw.wireless.bell.ca/ium-OEMInterface/servlet/IUMServlet/
    ims:
        apn: ims
        domain: ims.bell.ca
        epdg:
            candidates:
                - address: epdg.epc.mnc610.mcc302.pub.3gppnetwork.org
                  ip_family: ipv6
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha1
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        impi_format: imsi@carrierDomain
        ip_stack: ipv6
        media:
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "408"
                    - "480"
                    - "488"
                    - "500"
                    - "504"
                    - "600"
                    - "606"
                    - "503"
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 5000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
plmn_overrides:
    "302610":
        ims:
            epdg:
                candidates: null
