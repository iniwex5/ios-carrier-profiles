version: 3
kind: carrier_bundle
id: apple_apt_tw
bundle: APT_tw.bundle
supported_plmns:
    - "46605"
    - "52505"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 1040
    e911:
        emergency_urns:
            "110": urn:service:sos.police
            "112": urn:service:sos.fire
            "119": urn:service:sos.ambulance
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://es.gtcloud.net.tw
    ims:
        apn: ims
        domain: volte.aptg.com.tw
        epdg:
            address: epdg.epc.aptg.com.tw
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha1
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        impi_format: imsi@carrierDomain
        impu_format: msisdn@carrierDomain
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
        signaling:
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
