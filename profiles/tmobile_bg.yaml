version: 3
kind: carrier_bundle
id: apple_tmobile_bg
bundle: TMobile_bg.bundle
supported_plmns:
    - "28405"
plmn_overrides:
    "28405":
        apple:
            carrier_entitlements:
                supported_entitlements: 5121
        entitlement:
            entitlement_url: https://esim-es-open-prod-tlr.esimcloud.net/tlr/prod/executeAppleActions
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
