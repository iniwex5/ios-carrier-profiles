version: 3
kind: carrier_bundle
id: apple_melita_mt
bundle: Melita_mt.bundle
supported_plmns:
    - "27877"
plmn_overrides:
    "27877":
        apns:
            - apn: web.melita
              type_mask: 49
              allowed_ip_stack: ipv4
              apple_options:
                AllowedProtocolMaskInRoaming: 0
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4v6
              support_switch_over: true
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.mnc077.mcc278.pub.3gppnetwork.org
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: Certificate
                      eap_method: EAP-AKA
                local_identifier: anonymous@nai.epc.mnc077.mcc278.3gppnetwork.org
                username: 0$imsi@nai.epc.mnc077.mcc278.3gppnetwork.org
                remote_certificate_authority_name: DigiCert Global Root G2
                remote_certificate_hostname: epdg.epc.mnc077.mcc278.pub.3gppnetwork.org
                validate_remote_certificate: true
            signaling:
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
