version: 3
kind: carrier_bundle
id: apple_melita_mt
bundle: Melita_mt.bundle
supported_plmns:
    - "27877"
common: {}
plmn_overrides:
    "27877":
        ims:
            apn: ims
            ip_stack: ipv4v6
            signaling:
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
