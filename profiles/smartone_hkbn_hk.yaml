version: 3
kind: carrier_bundle
id: apple_smartone_hkbn_hk
bundle: SmarTone_HKBN_hk.bundle
supported_plmns:
    - "45406"
common: {}
plmn_overrides:
    "45406":
        apple:
            carrier_entitlements:
                supported_entitlements: 129
        entitlement:
            entitlement_url: https://cmc.ses.smcn3a.net/entitlement/
        ims:
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                re_register_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - "494"
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
