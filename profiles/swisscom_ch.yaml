version: 3
kind: carrier_bundle
id: apple_swisscom_ch
bundle: Swisscom_ch.bundle
supported_plmns:
    - "22801"
plmn_overrides:
    "22801":
        apns:
            - apn: gprs.swisscom.ch
              type_mask: 32819
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              use_network_mtu: true
              xlat464_enabled: true
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4v6
              support_switch_over: true
              support_5g_sa_handover: true
            - apn: event.swisscom.ch
              tech_type_mask: 2
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: sos
              type_mask: 262144
              allowed_ip_stack: ipv6
        apple:
            carrier_entitlements:
                supported_entitlements: 4307969
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
            emergency_urns:
                "112": urn:service:sos
                "117": urn:service:sos.police
                "118": urn:service:sos.fire
                "144": urn:service:sos.ambulance
                "911": urn:service:sos
                "1414": urn:service:sos.mountain
        entitlement:
            entitlement_url: https://ses.node.mnc001.mcc228.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.mnc001.mcc228.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                        - aes128
                      integrity:
                        - sha256
                        - sha256
                      prf:
                        - sha256
                        - sha256
                      dh_groups:
                        - 15
                        - 15
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                            - aes128
                          integrity:
                            - sha256
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                re_register_on:
                    - method: REGISTER
                      statuses:
                        - "504"
                    - method: INVITE
                      statuses:
                        - "504"
                require_qos_before_ringing: true
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    AckReceiveTimeout: 32000
                    AckRetransmitTimer: 32000
                    B: 32000
                    D: 32000
                    F: 32000
                    H: 32000
                    InviteResponseTimeout: 0
                    J: 32000
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1; cmr=1
                rtcp_interval_seconds: 5
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
