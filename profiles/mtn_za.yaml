version: 3
kind: carrier_bundle
id: apple_mtn_za
bundle: MTN_za.bundle
supported_plmns:
    - "65510"
plmn_overrides:
    "65510":
        apple:
            carrier_entitlements:
                supported_entitlements: 5121
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://es1staging.mtn.co.za/entitlement/
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
            ike:
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: 2
                          esn: auto
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                additional_headers:
                    - selector: INVITE,INVITE:*
                      headers:
                        - 'Feature-Caps: *;+g.3gpp.srvcc-alerting'
            media:
                rtp_inactivity_seconds: 20
                remote_rtcp_deactivation: true
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
