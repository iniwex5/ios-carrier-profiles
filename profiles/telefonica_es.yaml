version: 3
kind: carrier_bundle
id: apple_telefonica_es
bundle: Telefonica_es.bundle
supported_plmns:
    - "21407"
common: {}
plmn_overrides:
    "21407":
        apple:
            carrier_entitlements:
                supported_entitlements: 97281
        entitlement:
            entitlement_url: https://entitlement.movistar.es/entitlement/
        ims:
            apn: ims
            ip_stack: ipv6
            ike:
                nat_keepalive_enabled: true
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1400
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 15
                rtcp_interval_seconds: 5
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
