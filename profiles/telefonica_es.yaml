version: 3
kind: carrier_bundle
id: apple_telefonica_es
bundle: Telefonica_es.bundle
supported_plmns:
    - "21407"
plmn_overrides:
    "21407":
        apns:
            - apn: telefonica.es
              username: telefonica
              password: telefonica
              type_mask: 32819
              allowed_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
              use_network_mtu: true
            - apn: xcap
              type_mask: 1048576
              allowed_ip_stack: ipv4v6
        apple:
            carrier_entitlements:
                supported_entitlements: 4291585
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://entitlement.movistar.es/entitlement/
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc007.mcc214.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          esn: auto
                          lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1400
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=2
                rtp_inactivity_seconds: 15
                rtcp_interval_seconds: 5
                evs_hard_bw_limit: nb-swb
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
