version: 3
kind: carrier_bundle
id: apple_tmn_pt
bundle: TMN_pt.bundle
supported_plmns:
    - "26806"
plmn_overrides:
    "26806":
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        entitlement:
            entitlement_url: https://aes.mnc006.mcc268.pub.3gppnetwork.org:443
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "500"
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                        - selector: REGISTER,INVITE[-wifi]
                          params:
                            - +g.3gpp.accesstype="cellular2"
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                        - selector: REGISTER[wifi]
                          params:
                            - +g.3gpp.accesstype="wlan1"
            volte:
                enable_volte_by_default: true
