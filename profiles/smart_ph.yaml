version: 3
kind: carrier_bundle
id: apple_smart_ph
bundle: Smart_ph.bundle
supported_plmns:
    - "51503"
plmn_overrides:
    "51503":
        apple:
            carrier_entitlements:
                supported_entitlements: 1
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://esim-pldt-es-prd.ipaas.amdocs.com/pldt/prd/executeAppleActions
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc003.mcc515.3gppnetwork.org
            impi_format: imsi@carrierDomain
            impu_format: msisdn@carrierDomain
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha1
                      prf:
                        - sha1
                      dh_groups:
                        - 2
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha1
                          rekey_pfs_group: modp1024
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: false
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    D: 128000
                    F: 0
                    T1: 2000
                    T2: 16000
                    T4: 17000
            media:
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
