version: 3
kind: carrier_bundle
id: apple_crosswireless_bravado_lte_us
bundle: CrossWireless_Bravado_LTE_US.bundle
supported_plmns:
    - "313010"
common: {}
plmn_overrides:
    "313010":
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                contact:
                    always_add_sip_instance: true
            media:
                rtp_inactivity_seconds: 10
                rtcp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
