version: 3
kind: carrier_bundle
id: apple_truphone_us
bundle: Truphone_US.bundle
supported_plmns:
    - "23410"
    - "45400"
    - "20408"
    - "20433"
    - "20404"
    - "23425"
    - "310300"
    - "45408"
    - "21427"
    - "26242"
    - "26033"
    - "50538"
    - "20809"
    - "20812"
    - "72455"
    - "27227"
    - "22876"
common:
    apns:
        - apn: truphone.com
          type_mask: 32823
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          support_switch_over: true
        - apn: hos
          type_mask: 1048576
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: sos
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 8411
    e911:
        over_itech_supported: false
    entitlement:
        entitlement_url: https://entitlement-prod.api.truphone.com
    ims:
        apn: ims
        epdg:
            address: epdg.eps.truphone.net
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha512
                      rekey_pfs_group: 15
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha512
                  prf:
                    - sha512
                  dh_groups:
                    - 15
                  lifetime_seconds: 80000
                  eap_method: EAP-AKA
            validate_remote_certificate: false
        ip_stack: ipv4v6
        media:
            codecs:
                - payload_type: 109
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-24.4; bw=nb-wb; ch-aw-recv=0
            max_redundancy: 220
            rtcp_inactivity_seconds: 36000
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 14
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "406"
                    - "414"
                    - "499"
                    - "500"
                    - "501"
                    - "502"
                    - "503"
                    - "504"
                    - "505"
                    - "513"
                    - "580"
                    - "606"
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                B: 8000
                F: 16000
                InviteResponseTimeout: 5000
            support_p_early_media: true
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
