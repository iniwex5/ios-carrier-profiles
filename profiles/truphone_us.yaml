version: 3
kind: carrier_bundle
id: apple_truphone_us
bundle: Truphone_US.bundle
supported_plmns:
    - "20404"
    - "20408"
    - "20433"
    - "20809"
    - "20812"
    - "21427"
    - "23410"
    - "23425"
    - "26033"
    - "26242"
    - "27227"
    - "310300"
    - "45400"
    - "45408"
    - "50538"
    - "72455"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 8411
    e911:
        over_itech_supported: false
    entitlement:
        entitlement_url: https://entitlement-prod.api.truphone.com
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.eps.truphone.net
                  ip_family: ipv4v6
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha512
                      rekey_pfs_group: 15
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        ip_stack: ipv4v6
        media:
            rtcp_inactivity_seconds: 36000
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 14
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "406"
                    - "414"
                    - "499"
                    - "500"
                    - "501"
                    - "502"
                    - "503"
                    - "504"
                    - "505"
                    - "513"
                    - "580"
                    - "606"
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                B: 8000
                F: 16000
                InviteResponseTimeout: 5000
            support_p_early_media: true
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
