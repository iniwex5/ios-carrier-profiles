version: 3
kind: carrier_bundle
id: apple_movistar_cr
bundle: movistar_cr.bundle
supported_plmns:
    - "71204"
plmn_overrides:
    "71204":
        apns:
            - apn: internet.movistar.cr
              username: movistarcr
              password: movistarcr
              type_mask: 32817
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4v6
        apple:
            carrier_entitlements:
                supported_entitlements: 8209
        entitlement:
            entitlement_url: https://ses.mnc004.mcc712.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=24.4; bw=nb-swb; ch-aw-recv=-1
                rtp_inactivity_seconds: 10
                evs_hard_bw_limit: nb-swb
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
