version: 3
kind: carrier_bundle
id: apple_taiwanmobile_tw
bundle: TaiwanMobile_tw.bundle
supported_plmns:
    - "46697"
plmn_overrides:
    "46697":
        apple:
            carrier_entitlements:
                supported_entitlements: 3201
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: false
            emergency_urns:
                "110": urn:service:sos.police
                "112": urn:service:sos.ambulance
                "119": urn:service:sos.fire
        entitlement:
            entitlement_url: https://entitlement.taiwanmobile.com/volte
        ims:
            apn: ims
            ip_stack: ipv6
            domain: ims.taiwanmobile.com
            impi_format: imsi@carrierDomain
            impu_format: msisdn@carrierDomain
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                require_preconditions_when_mandatory: false
            media:
                rtcp_inactivity_seconds: 180
            volte:
                enable_volte_by_default: true
