version: 3
kind: carrier_bundle
id: apple_vodafone_nl
bundle: Vodafone_nl.bundle
supported_plmns:
    - "20404"
    - "26202"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 9216
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://es-nl.multiopco.entitlement.vodafone.com:4454/ium-OEMInterface/servlet/IUMServlet
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: modp2048
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: anonymous@nai.epc.mnc004.mcc204.3gppnetwork.org
            remote_certificate_authority_name: DigiCert Global Root G2
            remote_certificate_hostname: epdg.epc.mnc004.mcc204.pub.3gppnetwork.org
            sa_lifetime_seconds: 80000
            validate_remote_certificate: true
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            preconditions: supported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
