version: 3
kind: carrier_bundle
id: apple_optus_au
bundle: Optus_au.bundle
supported_plmns:
    - "50502"
common: {}
plmn_overrides:
    "50502":
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        entitlement:
            entitlement_url: https://oes.optusnet.com.au
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                local_identifier: Optus@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
