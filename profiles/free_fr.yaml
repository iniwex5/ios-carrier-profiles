version: 3
kind: carrier_bundle
id: apple_free_fr
bundle: Free_fr.bundle
supported_plmns:
    - "20815"
plmn_overrides:
    "20815":
        apns:
            - apn: free
              type_mask: 32819
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
            - apn: free
              type_mask: 4
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
              use_network_mtu: true
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv6
        apple:
            carrier_entitlements:
                supported_entitlements: 4240385
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://entitlement-apl.free-mobile.fr
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc015.mcc208.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 2
                      lifetime_seconds: 86400
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 2
                          esn: auto
                          lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb
                preferred_amr_wb_mode: 8
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
