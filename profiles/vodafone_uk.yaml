version: 3
kind: carrier_bundle
id: apple_vodafone_uk
bundle: Vodafone_uk.bundle
supported_plmns:
    - "23415"
common: {}
plmn_overrides:
    "23415":
        apple:
            carrier_entitlements:
                supported_entitlements: 74768
        entitlement:
            entitlement_url: https://entsrv-uk.vodafone.com:4443/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 5XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                            - +g.3gpp.smsip
            media:
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
