version: 3
kind: carrier_bundle
id: apple_mtn_cy
bundle: MTN_cy.bundle
supported_plmns:
    - "28010"
plmn_overrides:
    "28010":
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
