version: 3
kind: carrier_bundle
id: apple_mtn_cy
bundle: MTN_cy.bundle
supported_plmns:
    - "28010"
plmn_overrides:
    "28010":
        apns:
            - apn: internet
              type_mask: 32817
            - apn: mms
              username: mms
              password: mms
              type_mask: 4
        apple:
            carrier_entitlements:
                supported_entitlements: 8193
        entitlement:
            entitlement_url: https://es.epic.com.cy
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 106
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=0
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
