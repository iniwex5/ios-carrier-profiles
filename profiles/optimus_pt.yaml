version: 3
kind: carrier_bundle
id: apple_optimus_pt
bundle: Optimus_pt.bundle
supported_plmns:
    - "26006"
    - "26803"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 5121
    entitlement:
        entitlement_url: https://ses.ims.nos.pt
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 86400
            nat_keepalive_enabled: true
            sa_lifetime_seconds: 86400
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "408"
                    - 5XX
            preconditions: supported
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "26006":
        ims:
            epdg:
                address: epdg.epc.mnc003.mcc268.pub.3gppnetwork.org
