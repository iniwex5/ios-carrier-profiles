version: 3
kind: carrier_bundle
id: apple_antel_uy
bundle: Antel_uy.bundle
supported_plmns:
    - "74801"
plmn_overrides:
    "74801":
        e911:
            wifi_calling_without_entitlement: true
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 10
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
