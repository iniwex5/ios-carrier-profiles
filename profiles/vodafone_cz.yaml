version: 3
kind: carrier_bundle
id: apple_vodafone_cz
bundle: Vodafone_cz.bundle
supported_plmns:
    - "23003"
common: {}
plmn_overrides:
    "23003":
        apple:
            carrier_entitlements:
                supported_entitlements: 13312
        entitlement:
            entitlement_url: https://es-cz.multiopco.entitlement.vodafone.com:4452/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ike:
                dpd:
                    enabled: false
                    interval_seconds: 600
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "503"
                        - "504"
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE[-wifi]
                          params:
                            - +g.3gpp.accesstype="cellular2"
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                        - selector: REGISTER[wifi]
                          params:
                            - +g.3gpp.accesstype="wlan1"
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
