version: 3
kind: carrier_bundle
id: apple_mobileone_sg
bundle: MobileOne_sg.bundle
supported_plmns:
    - "52503"
common: {}
plmn_overrides:
    "52503":
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        entitlement:
            entitlement_url: https://mdm.m1.com.sg/ES/apple
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.mobileone.net.sg
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 8640
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 8640
                    lifetime_seconds: 8640
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 8640
            register:
                use_ipsec: true
            signaling:
                preconditions: required
                support_p_early_media: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
