version: 3
kind: carrier_bundle
id: apple_telstra_au
bundle: Telstra_au.bundle
supported_plmns:
    - "50501"
    - "50571"
    - "50572"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 533505
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://telentprod.mobile.telstra.com
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.epc.mnc001.mcc505.pub.3gppnetwork.org
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 300
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: Telstra@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            remote_certificate_authority_name: DigiCert Global Root G2
            remote_certificate_hostname: epdg.epc.mnc001.mcc505.pub.3gppnetwork.org
            sa_lifetime_seconds: 80000
            validate_remote_certificate: true
        ip_stack: ipv4v6
        media:
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                T1: 2000
                T2: 16000
                T4: 17000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "50501":
        ims:
            epdg:
                candidates: null
