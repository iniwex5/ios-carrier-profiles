version: 3
kind: carrier_bundle
id: apple_tmobile_uk
bundle: TMobile_uk.bundle
supported_plmns:
    - "23430"
plmn_overrides:
    "23430":
        apns:
            - apn: everywhere
              type_mask: 32817
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              xlat464_enabled: true
            - apn: eezone
              type_mask: 1048582
              tech_type_mask: 1048582
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv6
        apple:
            carrier_entitlements:
                supported_entitlements: 12626961
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://se.sim.ct.ee.co.uk:8443
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc030.mcc234.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                re_register_on:
                    - method: INVITE
                      statuses:
                        - "403"
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=2
                support_pcma: false
                support_pcmu: false
                rtp_inactivity_seconds: 20
                remote_rtcp_deactivation: true
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
