version: 3
kind: carrier_bundle
id: apple_verizon_comcast_lte_us
bundle: Verizon_Comcast_LTE_US.bundle
supported_plmns:
    - "310590"
    - "310599"
    - "311480"
common:
    apns:
        - apn: vzwinternet
          type_mask: 4194867
          allowed_ip_stack: ipv4v6
          domestic_roaming_ip_stack: ipv4
          always_on_pdu: true
        - apn: vzwapp
          type_mask: 49156
          tech_type_mask: 16390
          allowed_ip_stack: ipv4v6
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          always_on_pdu: true
          support_switch_over: true
          support_5g_sa_handover: true
          no_cellular_reconnect_cause_codes:
            - cause_codes:
                - 24
              recovers_on_airplane_mode: true
              num_tries_allowed: 3
              type: Non3GPP
            - cause_codes:
                - 8
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 27
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 29
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 32
              num_tries_allowed: 2
              type: 3GPP
            - cause_codes:
                - 33
              num_tries_allowed: 2
              type: 3GPP
        - apn: vzwadmin
          type_mask: 0
          allowed_ip_stack: ipv4v6
        - apn: vzwemergency
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 4205977
    e911:
        emergency_urns:
            "922": 922@vzims.com
        over_itech_supported: false
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://spc.myvzw.com/ium-RoadrunnerInterface/servlet/IUMServlet
    ims:
        apn: ims
        epdg:
            address: wo.vzwwo.com
            configuration_attributes:
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
            timeout_seconds: 45
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      protocol: esp
                      esn: auto
                      install_policies: true
                      secure_rekey: false
                      lifetime_seconds: 86400
            disable_switch_to_natt_port: true
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$impi_user@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
        ip_stack: ipv6
        media:
            codecs:
                - payload_type: 102
                  name: AMR
                  clock_rate: 8000
                  channels: 1
                  fmtp: octet-align=0; mode-set=7
                - payload_type: 104
                  name: AMR-WB
                  clock_rate: 16000
                  channels: 1
                  fmtp: octet-align=0; mode-set=2
                - payload_type: 106
                  name: AMR
                  clock_rate: 8000
                  channels: 1
                  fmtp: octet-align=0
                - payload_type: 108
                  name: AMR
                  clock_rate: 8000
                  channels: 1
                  fmtp: octet-align=1; mode-set=7
                - payload_type: 109
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=13.2; bw=swb; ch-aw-recv=3
                - payload_type: 110
                  name: AMR-WB
                  clock_rate: 16000
                  channels: 1
                  fmtp: octet-align=1; mode-set=2
                - payload_type: 115
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-13.2; bw=nb-swb; ch-aw-recv=3
            enable_incoming_dtmf: true
            evs_hard_bw_limit: nb-swb
            mode_set_amr_nb: "7"
            mode_set_amr_wb: "2"
            order_evs_codecs_by_codec_id: false
            rtcp_inactivity_seconds: 20
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
            support_amr_nb: false
            support_amr_wb: false
            use_ephemeral_rtp_ports: true
        register:
            use_ipsec: true
        signaling:
            additional_headers:
                - selector: INVITE[911,wifi]
                  headers:
                    - 'P-com.ServiceType: Static-Emergency'
                - selector: ACK,BYE,CANCEL,REGISTER,PRACK,SUBSCRIBE,INFO,REFER,MESSAGE,UPDATE,OPTIONS,INVITE:*[wifi]
                  headers:
                    - 'P-com.Service: ARC'
                - selector: INVITE[wifi]
                  headers:
                    - 'Security-Verify: sdes-srtp;mediasec'
                    - 'Proxy-Require: mediasec'
                    - 'P-com.Service: ARC'
            contact:
                additional_contact_params:
                    - selector: REGISTER
                      params:
                        - +g.3gpp.smsip
                        - q=0.5
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "503"
            early_media_needs_header: true
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            sip_timers:
                D: 128000
                F: 30000
                InviteResponseTimeout: 10000
                T1: 3000
                T2: 16000
                T4: 17000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
