version: 3
kind: carrier_bundle
id: apple_telenor_rs
bundle: Telenor_rs.bundle
supported_plmns:
    - "22001"
plmn_overrides:
    "22001":
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
