version: 3
kind: carrier_bundle
id: apple_claro_cl
bundle: Claro_cl.bundle
supported_plmns:
    - "73003"
plmn_overrides:
    "73003":
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
            emergency_urns:
                "112": urn:service:sos.police
                "131": urn:service:sos.ambulance
                "132": urn:service:sos.fire
                "133": urn:service:sos.police
                "136": urn:service:sos.mountain
                "137": urn:service:sos.marine
                "911": urn:service:sos.police
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                address: epdg.ims.mnc003.mcc730.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16389
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1300
                preconditions: supported
                support_p_early_media: true
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 30
                rtcp_inactivity_seconds: 25
                rtcp_interval_seconds: 5
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
