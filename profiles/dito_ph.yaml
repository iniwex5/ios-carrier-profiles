version: 3
kind: carrier_bundle
id: apple_dito_ph
bundle: Dito_ph.bundle
supported_plmns:
    - "20404"
    - "51566"
common:
    apns:
        - apn: internet.dito.ph
          type_mask: 49
          allowed_ip_stack: ipv4
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4
    ims:
        apn: ims
        domain: ims.mnc066.mcc515.3gppnetwork.org
        epdg:
            address: epdg.epc.mnc066.mcc515.pub.3gppnetwork.org
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha1
                      esn: auto
                replay_window_size: 32
            local_identifier: 0$imsi@nai.epc.mnc066.mcc515.3gppnetwork.org
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha1
                  prf:
                    - sha1
                  dh_groups:
                    - 2
                  authentication_method: None
                  eap_method: EAP-AKA
            username: 0$imsi@nai.epc.mnc066.mcc515.3gppnetwork.org
        ip_stack: ipv4
        register:
            expires: 7200
            include_cellular_network_info: true
            use_ipsec: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
