version: 3
kind: carrier_bundle
id: apple_inland_lte_us
bundle: Inland_LTE_US.bundle
supported_plmns:
    - "310580"
plmn_overrides:
    "310580":
        apple:
            carrier_entitlements:
                supported_entitlements: 145
        entitlement:
            entitlement_url: https://inland.dcc.entitlements.io3.com
        ims:
            apn: ims
            ip_stack: ipv4v6
            impi_format: imsi@carrierDomain
            impu_format: imsi@carrierDomain
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                ipsec_mtu: 1350
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                local_identifier_type: IDUserFQDN
                remote_identifier_type: IDFQDN
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 1300
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 5XX
                contact:
                    always_add_sip_instance: true
                additional_headers:
                    - selector: INVITE[911,wifi]
                      headers:
                        - 'Supported: geolocation'
                    - selector: INVITE[wifi,911]
                      headers:
                        - 'P-Emergency-Info: IEEE-802.11b;i-wlan-node-id=${DEVICE_REF_ID}'
                        - 'Supported: geolocation'
            media:
                rtp_inactivity_seconds: 10
                rtcp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
