version: 3
kind: carrier_bundle
id: apple_claro_uy
bundle: Claro_uy.bundle
supported_plmns:
    - "74810"
plmn_overrides:
    "74810":
        apns:
            - apn: igprs.claro.com.uy
              username: clarogprs
              password: clarogprs999
              type_mask: 1048625
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
            - apn: sos
              type_mask: 262144
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv4v6
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
            emergency_urns:
                "104": urn:service:sos.fire
                "105": urn:service:sos.ambulance
                "106": urn:service:sos.marine
                "108": urn:service:sos.police
                "128": urn:service:sos.mountain
                "911": urn:service:sos.police
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc010.mcc748.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 96
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=nb-swb; ch-aw-recv=2; cmr=0
                preferred_amr_nb_mode: 7
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
                mode_change_capability: 2
                evs_hard_bw_limit: nb-swb
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
