version: 3
kind: carrier_bundle
id: apple_eastlink_ca
bundle: Eastlink_ca.bundle
supported_plmns:
    - "20601"
    - "302270"
common:
    apns:
        - apn: mms.mobi.eastlink.ca
          type_mask: 4
          tech_type_mask: 4
        - apn: wisp.mobi.eastlink.ca
          type_mask: 32819
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          support_switch_over: true
        - apn: services
          type_mask: 1048576
          tech_type_mask: 1048578
          allowed_ip_stack: ipv4
          roaming_ip_stack: ipv4
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 4202673
    e911:
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://wireless-entitlements.eastlink.ca
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc270.mcc302.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 15
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 15
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            validate_remote_certificate: false
        impi_format: imsi@carrierDomain
        impu_format: msisdn@carrierDomain
        ip_stack: ipv6
        media:
            enable_incoming_dtmf: true
            max_redundancy: 220
            rtp_inactivity_seconds: 30
        register:
            expires: 7200
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "414"
                    - "499"
                    - "606"
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
