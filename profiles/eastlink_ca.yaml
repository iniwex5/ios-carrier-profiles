version: 3
kind: carrier_bundle
id: apple_eastlink_ca
bundle: Eastlink_ca.bundle
supported_plmns:
    - "20601"
    - "302270"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 8369
    e911:
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://wireless-entitlements.eastlink.ca
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 15
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 15
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
            validate_remote_certificate: false
        impi_format: imsi@carrierDomain
        impu_format: msisdn@carrierDomain
        ip_stack: ipv6
        media:
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "414"
                    - "499"
                    - "606"
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
plmn_overrides:
    "20601":
        ims:
            epdg:
                candidates:
                    - address: epdg.epc.mnc270.mcc302.pub.3gppnetwork.org
                      source: uicc
                      priority: 20
