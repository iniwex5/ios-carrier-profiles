version: 3
kind: carrier_bundle
id: apple_tigo_co
bundle: Tigo_co.bundle
supported_plmns:
    - "732103"
    - "732111"
common:
    e911:
        emergency_urns:
            "112": urn:service:sos.police
            "123": urn:service:sos.ambulance
    ims:
        apn: ims
        ip_stack: ipv4v6
        media:
            rtcp_inactivity_seconds: 10
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 10
        register:
            use_ipsec: false
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: false
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 5000
            support_p_early_media: false
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
