version: 3
kind: carrier_bundle
id: apple_bakcell_az
bundle: Bakcell_az.bundle
supported_plmns:
    - "40002"
plmn_overrides:
    "40002":
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
