version: 3
kind: carrier_bundle
id: apple_mobilkom_at
bundle: mobilkom_at.bundle
supported_plmns:
    - "23201"
    - "23202"
    - "23211"
    - "23212"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 9217
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://esim-es-open-prod-aoneat.esimcloud.net/aoneat/prod/executeAppleActions
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.epc.mnc001.mcc232.pub.3gppnetwork.org
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16389
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            remote_identifier_type: KeyID
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 20
        register:
            use_ipsec: true
        signaling:
            additional_headers:
                - selector: INVITE
                  headers:
                    - 'Accept: application/sdp,application/3gpp-ims+xml'
                - selector: INVITE,INVITE:*
                  headers:
                    - 'Feature-Caps: *;+g.3gpp.srvcc-alerting'
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*[primary]
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 4000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
plmn_overrides:
    "23201":
        ims:
            epdg:
                candidates: null
