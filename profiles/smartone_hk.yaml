version: 3
kind: carrier_bundle
id: apple_smartone_hk
bundle: SmarTone_hk.bundle
supported_plmns:
    - "45406"
    - "45415"
    - "45417"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 11649
    entitlement:
        entitlement_url: https://tremblant.ses.smcn3a.net/entitlement/
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc006.mcc454.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 80000
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            max_udp_message_size: 1200
            preconditions: unsupported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "408"
                    - "494"
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "45406":
        ims:
            epdg:
                address: null
