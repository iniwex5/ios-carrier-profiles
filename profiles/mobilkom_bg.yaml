version: 3
kind: carrier_bundle
id: apple_mobilkom_bg
bundle: mobilkom_bg.bundle
supported_plmns:
    - "28401"
common: {}
plmn_overrides:
    "28401":
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        entitlement:
            entitlement_url: https://esim-es-open-prod-aonebg.esimcloud.net/aonebg/prod/executeAppleActions
        ims:
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "408"
                        - 5XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
