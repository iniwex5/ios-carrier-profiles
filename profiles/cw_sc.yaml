version: 3
kind: carrier_bundle
id: apple_cw_sc
bundle: CW_sc.bundle
supported_plmns:
    - "63301"
plmn_overrides:
    "63301":
        ims:
            apn: ims
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "403"
                        - "404"
                        - "500"
                        - "501"
                        - "503"
                        - "504"
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtcp_inactivity_seconds: 3600
            volte:
                enable_volte_by_default: true
