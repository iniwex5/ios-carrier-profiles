version: 3
kind: carrier_bundle
id: apple_coriolis_fr
bundle: Coriolis_fr.bundle
supported_plmns:
    - "20801"
    - "20809"
    - "20827"
common:
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.epc.mnc027.mcc208.pub.3gppnetwork.org
                  ip_family: ipv4v6
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      lifetime_seconds: 86400
            nat_keepalive_enabled: true
            sa_lifetime_seconds: 86400
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 20
        register:
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "500"
                    - "503"
                    - "488"
            early_media_needs_header: true
            preconditions: supported
            support_p_early_media: true
    roaming:
        wifi_calling_allowed: false
plmn_overrides:
    "20827":
        ims:
            epdg:
                candidates: null
