version: 3
kind: carrier_bundle
id: apple_tim_kena_it
bundle: TIM_Kena_it.bundle
supported_plmns:
    - "22201"
    - "22207"
common:
    ims:
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*[primary]
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            early_media_needs_header: true
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
