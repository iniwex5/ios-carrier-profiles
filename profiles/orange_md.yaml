version: 3
kind: carrier_bundle
id: apple_orange_md
bundle: Orange_md.bundle
supported_plmns:
    - "25901"
plmn_overrides:
    "25901":
        apns:
            - apn: wap.orange.md
              type_mask: 49
            - apn: wap.orange.md
              type_mask: 48
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                early_media_needs_header: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - 5XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 96
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=swb
                    - payload_type: 97
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
