version: 3
kind: carrier_bundle
id: apple_vodafone_in
bundle: Vodafone_in.bundle
supported_plmns:
    - "40401"
    - "40405"
    - "40411"
    - "40413"
    - "40415"
    - "40420"
    - "40427"
    - "40430"
    - "40443"
    - "40446"
    - "40460"
    - "40484"
    - "40486"
    - "40488"
    - "40566"
    - "40567"
    - "405750"
    - "405751"
    - "405752"
    - "405753"
    - "405754"
    - "405755"
    - "405756"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 1041
    entitlement:
        entitlement_url: https://wes.vodafoneidea.com/Apple/
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16389
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                        - sha1
                      lifetime_seconds: 86400
            dpd:
                enabled: true
                interval_seconds: 600
            local_identifier: 0$impi_user@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 2
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        ip_stack: ipv4
        media:
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 5XX
                    - 6XX
            preconditions: supported
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
