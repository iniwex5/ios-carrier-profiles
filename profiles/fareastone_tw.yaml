version: 3
kind: carrier_bundle
id: apple_fareastone_tw
bundle: FarEasTone_tw.bundle
supported_plmns:
    - "46601"
plmn_overrides:
    "46601":
        apple:
            carrier_entitlements:
                supported_entitlements: 3217
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: false
            emergency_urns:
                "110": urn:service:sos.police
                "112": urn:service:sos.ambulance
                "119": urn:service:sos.fire
        entitlement:
            entitlement_url: https://fetses.fetnet.net/entitlement
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc001.mcc466.3gppnetwork.org
            impi_format: imsi@carrierDomain
            epdg:
                address: epdg.epc.mnc001.mcc466.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "404"
                        - "414"
                        - "499"
                        - "606"
                require_preconditions_when_mandatory: false
            media:
                rtp_inactivity_seconds: 300
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
