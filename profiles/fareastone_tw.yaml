version: 3
kind: carrier_bundle
id: apple_fareastone_tw
bundle: FarEasTone_tw.bundle
supported_plmns:
    - "46601"
common: {}
plmn_overrides:
    "46601":
        apple:
            carrier_entitlements:
                supported_entitlements: 3217
        entitlement:
            entitlement_url: https://fetses.fetnet.net/entitlement
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc001.mcc466.3gppnetwork.org
            impi_format: imsi@carrierDomain
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "404"
                        - "414"
                        - "499"
                        - "606"
            media:
                rtp_inactivity_seconds: 300
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
