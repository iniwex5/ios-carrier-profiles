version: 3
kind: carrier_bundle
id: apple_claro_pa
bundle: Claro_pa.bundle
supported_plmns:
    - "33402"
    - "334020"
    - "71403"
common:
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.ims.mnc003.mcc714.pub.3gppnetwork.org
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16389
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha1
                      rekey_pfs_group: 2
                      esn: auto
                      lifetime_seconds: 86400
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha1
                  prf:
                    - sha1
                  dh_groups:
                    - 2
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        ip_stack: ipv4
        media:
            rtp_inactivity_seconds: 10
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            early_media_needs_header: true
            preconditions: supported
            support_p_early_media: true
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
