version: 3
kind: carrier_bundle
id: apple_etisalat_af
bundle: Etisalat_af.bundle
supported_plmns:
    - "41250"
plmn_overrides:
    "41250":
        e911:
            over_itech_supported: true
            emergency_urns:
                "100": urn:service:sos.police
                "101": urn:service:sos.fire
                "102": urn:service:sos.ambulance
                "119": urn:service:sos.mountain
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 4XX
                        - 5XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: false
