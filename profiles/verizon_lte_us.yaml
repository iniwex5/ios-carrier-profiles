version: 3
kind: carrier_bundle
id: apple_verizon_lte_us
bundle: Verizon_LTE_US.bundle
supported_plmns:
    - "20404"
    - "310590"
    - "310599"
    - "311480"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4238745
    entitlement:
        entitlement_url: https://spc.myvzw.com/ium-RoadrunnerInterface/servlet/IUMServlet
    ims:
        apn: ims
        epdg:
            address: wo.vzwwo.com
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 86400
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: anonymous@nai.epc.mnc480.mcc311.3gppnetwork.org
            sa_lifetime_seconds: 80000
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 20
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER:*
                      params: []
                    - selector: REGISTER
                      params:
                        - +g.3gpp.smsip
                        - q=0.5
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "503"
            preconditions: unsupported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
