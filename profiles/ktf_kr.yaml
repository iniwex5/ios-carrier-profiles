version: 3
kind: carrier_bundle
id: apple_ktf_kr
bundle: KTF_kr.bundle
supported_plmns:
    - "45002"
    - "45008"
common:
    apns:
        - apn: internet
          type_mask: 5275653
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          always_on_pdu: true
          xlat464_enabled: true
        - apn: IMS
          type_mask: 131072
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          always_on_pdu: true
          support_5g_sa_handover: true
        - apn: tethering
          type_mask: 48
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          always_on_pdu: true
          xlat464_enabled: true
    apple:
        carrier_entitlements:
            supported_entitlements: 9217
    entitlement:
        entitlement_url: https://api.econovation.co.kr/adcb/rest/getEapAKA
    ims:
        apn: ims
        ip_stack: ipv4v6
        media:
            codecs:
                - payload_type: 110
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=9.6-24.4; bw=nb-swb
            evs_hard_bw_limit: nb-swb
            packet_alignment_amr_nb: octetAlignedOnly
            packet_alignment_amr_wb: octetAlignedOnly
            payload_type_be_amr_nb: 100
            payload_type_be_amr_wb: 97
            payload_type_oa_amr_nb: 101
            payload_type_oa_amr_wb: 98
            rtcp_inactivity_seconds: 36000
            rtcp_interval_seconds: 5
            telephone_event_pt_16k: 99
            telephone_event_pt_8k: 102
        register:
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "404"
                    - "414"
                    - "499"
                    - "606"
            early_media_needs_header: true
            max_udp_message_size: 3000
            preconditions: unsupported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "406"
                    - "408"
                    - "504"
            require_preconditions_when_mandatory: false
            sip_timers:
                A: 1000
                B: 8000
                C: 72000
                D: 32000
                E: 2000
                F: 16000
                G: 2000
                H: 36000
                I: 17000
                InviteResponseTimeout: 5000
                J: 32000
                K: 17000
                T1: 2000
                T2: 16000
                T4: 17000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
