version: 3
kind: carrier_bundle
id: apple_ktf_kr
bundle: KTF_kr.bundle
supported_plmns:
    - "45002"
    - "45008"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 9217
    e911:
        emergency_urns:
            "111": urn:service:sos.country-specific.kr.111
            "112": urn:service:sos.police
            "113": urn:service:sos.country-specific.kr.113
            "117": urn:service:sos.country-specific.kr.117
            "118": urn:service:sos.country-specific.kr.118
            "119": urn:service:sos.fire
            "122": urn:service:sos.marine
            "125": urn:service:sos.country-specific.kr.125
            "911": urn:service:sos.fire
    entitlement:
        entitlement_url: https://api.econovation.co.kr/adcb/rest/getEapAKA
    ims:
        apn: ims
        ip_stack: ipv4v6
        media:
            rtcp_interval_seconds: 5
        register:
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "404"
                    - "414"
                    - "499"
                    - "606"
            max_udp_message_size: 3000
            preconditions: unsupported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "406"
                    - "408"
                    - "504"
            sip_timers:
                A: 1000
                B: 8000
                C: 72000
                D: 32000
                E: 2000
                F: 16000
                G: 2000
                H: 36000
                I: 17000
                InviteResponseTimeout: 5000
                J: 32000
                K: 17000
                T1: 2000
                T2: 16000
                T4: 17000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
