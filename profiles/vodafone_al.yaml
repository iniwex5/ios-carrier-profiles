version: 3
kind: carrier_bundle
id: apple_vodafone_al
bundle: Vodafone_al.bundle
supported_plmns:
    - "27602"
plmn_overrides:
    "27602":
        apns:
            - apn: vodafoneweb
              username: web
              password: web
              type_mask: 49
            - apn: vodafoneweb
              username: web
              password: web
              type_mask: 48
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4
              support_switch_over: true
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                address: epdg.epc.mnc002.mcc276.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 2
                      lifetime_seconds: 86400
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 2
                          esn: auto
                          lifetime_seconds: 86400
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - 5XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=0
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 10
                mode_change_capability: 2
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
