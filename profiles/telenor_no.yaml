version: 3
kind: carrier_bundle
id: apple_telenor_no
bundle: Telenor_no.bundle
supported_plmns:
    - "24201"
plmn_overrides:
    "24201":
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
            emergency_urns:
                "110": urn:service:sos.fire
                "112": urn:service:sos.police
                "113": urn:service:sos.ambulance
        entitlement:
            entitlement_url: https://ensp.telenor.no/entitlement
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 15
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                nat_keepalive_seconds: 20
                ipsec_mtu: 1280
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 5XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
selector_overrides:
    24201_ID-89470002:
        apple:
            carrier_entitlements:
                supported_entitlements: 1025
    24201_ID-89470003:
        apple:
            carrier_entitlements:
                supported_entitlements: 1025
    24201_ID-89470022:
        apple:
            carrier_entitlements:
                supported_entitlements: 1025
    24201_ID-89470023:
        apple:
            carrier_entitlements:
                supported_entitlements: 1025
