version: 3
kind: carrier_bundle
id: apple_digi_my
bundle: DiGi_my.bundle
supported_plmns:
    - "50216"
common: {}
plmn_overrides:
    "50216":
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        entitlement:
            entitlement_url: https://es.digi.com.my/entitlement
        ims:
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "500"
                        - "503"
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
