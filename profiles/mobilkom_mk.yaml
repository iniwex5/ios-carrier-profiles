version: 3
kind: carrier_bundle
id: apple_mobilkom_mk
bundle: mobilkom_mk.bundle
supported_plmns:
    - "29403"
plmn_overrides:
    "29403":
        apns:
            - apn: vipoperator
              type_mask: 49
            - apn: vipoperator.mms
              type_mask: 4
        apple:
            carrier_entitlements:
                supported_entitlements: 8193
        entitlement:
            entitlement_url: https://esim-es-open-prod-aonemk.esimcloud.net/aonemk/prod/executeAppleActions
        ims:
            register:
                use_ipsec: true
            signaling:
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
