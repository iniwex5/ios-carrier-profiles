version: 3
kind: carrier_bundle
id: apple_o2_sky_uk
bundle: O2_Sky_uk.bundle
supported_plmns:
    - "23457"
    - "24007"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 8193
    entitlement:
        entitlement_url: https://esim-es-open-prod-skyuk.esimcloud.net/skyuk/prod/executeAppleActions/
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      lifetime_seconds: 86400
            dpd:
                enabled: false
                interval_seconds: 600
            nat_keepalive_enabled: true
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        ip_stack: ipv4v6
        media:
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: false
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.srvcc-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - 5XX
            preconditions: supported
            support_p_early_media: true
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "24007":
        ims:
            epdg:
                address: epdg.epc.mnc057.mcc234.pub.3gppnetwork.org
