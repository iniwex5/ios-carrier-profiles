version: 3
kind: carrier_bundle
id: apple_gta_gu
bundle: GTA_gu.bundle
supported_plmns:
    - "310140"
common: {}
plmn_overrides:
    "310140":
        apple:
            carrier_entitlements:
                supported_entitlements: 176
        entitlement:
            entitlement_url: https://ses.ims.mnc140.mcc310.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                dpd:
                    enabled: true
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha512
                          pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "414"
                        - "499"
                        - "606"
                        - "400"
                        - "403"
                        - "500"
            media:
                rtp_inactivity_seconds: 30
            volte:
                enable_volte_by_default: true
