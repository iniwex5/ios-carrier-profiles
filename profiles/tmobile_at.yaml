version: 3
kind: carrier_bundle
id: apple_tmobile_at
bundle: TMobile_at.bundle
supported_plmns:
    - "23203"
    - "23207"
    - "23223"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4203521
    entitlement:
        entitlement_url: https://entitlement-tma.telekom.de
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc003.mcc232.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 64800
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      lifetime_seconds: 64800
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            sa_lifetime_seconds: 64800
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 180
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*[primary]
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            preconditions: supported
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "23203":
        ims:
            epdg:
                address: null
