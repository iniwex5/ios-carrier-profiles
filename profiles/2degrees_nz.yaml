version: 3
kind: carrier_bundle
id: apple_2degrees_nz
bundle: 2degrees_nz.bundle
supported_plmns:
    - "53024"
common: {}
plmn_overrides:
    "53024":
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        entitlement:
            entitlement_url: https://ios.es.2degreesmobile.co.nz
        ims:
            epdg:
                address: epdg.ims.2degrees.net.nz
            ike:
                dpd:
                    enabled: false
                    interval_seconds: 300
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "412"
                        - "488"
                        - 5XX
                        - "606"
                contact:
                    always_add_sip_instance: true
            media:
                rtp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
