version: 3
kind: carrier_bundle
id: apple_2degrees_nz
bundle: 2degrees_nz.bundle
supported_plmns:
    - "53024"
plmn_overrides:
    "53024":
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://ios.es.2degreesmobile.co.nz
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                candidates:
                    - address: epdg.ims.2degrees.net.nz
                      source: uicc
                      priority: 20
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 2
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 300
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: 2
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "412"
                        - "488"
                        - 5XX
                        - "606"
                contact:
                    always_add_sip_instance: true
            media:
                rtp_inactivity_seconds: 10
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
