version: 3
kind: carrier_bundle
id: apple_unitedwireless_lte_us
bundle: UnitedWireless_LTE_US.bundle
supported_plmns:
    - "311650"
plmn_overrides:
    "311650":
        apple:
            carrier_entitlements:
                supported_entitlements: 144
        e911:
            over_itech_supported: false
            emergency_urns:
                default: urn:service:sos
        entitlement:
            entitlement_url: https://deg.app.unitedwireless.com:8181/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc650.mcc311.3gppnetwork.org
            impi_format: imsi@carrierDomain
            impu_format: imsi@carrierDomain
            epdg:
                address: epdg.epc.mnc650.mcc311.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                ipsec_mtu: 1280
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                local_identifier_type: IDUserFQDN
                remote_identifier_type: IDFQDN
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                early_media_needs_header: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                additional_headers:
                    - selector: INVITE[wifi,911]
                      headers:
                        - 'P-Emergency-Info: IEEE-802.11b;i-wlan-node-id=${DEVICE_REF_ID}'
                        - 'Supported: geolocation'
                sip_timers:
                    InviteResponseTimeout: 6000
            media:
                rtp_inactivity_seconds: 20
                rtcp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
