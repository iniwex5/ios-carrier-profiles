version: 3
kind: carrier_bundle
id: apple_inwi_ma
bundle: INWI_ma.bundle
supported_plmns:
    - "60402"
plmn_overrides:
    "60402":
        apns:
            - apn: www.inwi.ma
              type_mask: 49
            - apn: mms.wana.ma
              type_mask: 4
            - apn: www.inwi.ma
              type_mask: 48
        ims:
            register:
                use_ipsec: true
            signaling:
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
