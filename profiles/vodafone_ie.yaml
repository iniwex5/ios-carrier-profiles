version: 3
kind: carrier_bundle
id: apple_vodafone_ie
bundle: Vodafone_ie.bundle
supported_plmns:
    - "27201"
plmn_overrides:
    "27201":
        apns:
            - apn: live.vodafone.com
              type_mask: 32821
            - apn: IMS
              type_mask: 131072
              tech_type_mask: 131072
              support_switch_over: true
              allow_no_dns: 1
              no_cellular_reconnect_cause_codes:
                - cause_codes:
                    - 27
                  recovers_on_airplane_mode: true
                  num_tries_allowed: 1
                  type: 3GPP
                  timeout: 86400
            - apn: XCAP
              type_mask: 1048576
              tech_type_mask: 1048576
        apple:
            carrier_entitlements:
                supported_entitlements: 13312
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://ie-prod.entitlement.vodafone.com:4449/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            epdg:
                address: epdg.epc.mnc001.mcc272.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
            register:
                use_ipsec: true
                expires: 7200
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                additional_headers:
                    - selector: INVITE,INVITE:*
                      headers:
                        - 'Feature-Caps: *;+g.3gpp.srvcc-alerting'
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=-1; cmr=1
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
