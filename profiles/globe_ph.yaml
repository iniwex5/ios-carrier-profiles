version: 3
kind: carrier_bundle
id: apple_globe_ph
bundle: Globe_ph.bundle
supported_plmns:
    - "51502"
common: {}
plmn_overrides:
    "51502":
        apple:
            carrier_entitlements:
                supported_entitlements: 9233
        entitlement:
            entitlement_url: https://esim-es-open-prod-globe.esimcloud.net/globe/prod/executeAppleActions
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: weconnect.globe.com.ph
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 4XX
                        - 5XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
