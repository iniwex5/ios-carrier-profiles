version: 3
kind: carrier_bundle
id: apple_zain_bh
bundle: Zain_bh.bundle
supported_plmns:
    - "42602"
common: {}
plmn_overrides:
    "42602":
        apple:
            carrier_entitlements:
                supported_entitlements: 31745
        entitlement:
            entitlement_url: https://es.bh.zain.com
        ims:
            apn: ims
            ip_stack: ipv4
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 5XX
                        - 6XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
