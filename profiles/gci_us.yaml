version: 3
kind: carrier_bundle
id: apple_gci_us
bundle: GCI_US.bundle
supported_plmns:
    - "311370"
common: {}
plmn_overrides:
    "311370":
        apple:
            carrier_entitlements:
                supported_entitlements: 1200
        entitlement:
            entitlement_url: https://ses.epdg.gci.net
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc370.mcc311.3gppnetwork.org
            impi_format: imsi@carrierDomain
            impu_format: imsi@carrierDomain
            epdg:
                address: ims.epdg.gci.net
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: true
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "414"
                        - "499"
                        - "606"
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 30
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
