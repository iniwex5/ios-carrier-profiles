version: 3
kind: carrier_bundle
id: apple_gci_us
bundle: GCI_US.bundle
supported_plmns:
    - "311370"
plmn_overrides:
    "311370":
        apple:
            carrier_entitlements:
                supported_entitlements: 1200
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://ses.epdg.gci.net
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc370.mcc311.3gppnetwork.org
            impi_format: imsi@carrierDomain
            impu_format: imsi@carrierDomain
            epdg:
                candidates:
                    - address: ims.epdg.gci.net
                      source: uicc
                      priority: 20
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: true
                    max_retries: 3
                    retry_interval_seconds: 15
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "414"
                        - "499"
                        - "606"
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    InviteResponseTimeout: 5000
            media:
                rtp_inactivity_seconds: 30
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
