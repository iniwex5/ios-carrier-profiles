version: 3
kind: carrier_bundle
id: apple_dtac_th
bundle: dtac_th.bundle
supported_plmns:
    - "52005"
    - "52018"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 11473
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://es-new.truecorp.co.th/apple
    ims:
        apn: ims
        domain: ims.mnc005.mcc520.3gppnetwork.org
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      rekey_pfs_group: modp2048
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha512
                  prf:
                    - sha512
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        impi_format: imsi@carrierDomain
        impu_format: msisdn@carrierDomain
        ip_stack: ipv6
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "500"
                    - "503"
                    - "504"
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "52018":
        ims:
            epdg:
                address: epdg.epc.mnc005.mcc520.pub.3gppnetwork.org
