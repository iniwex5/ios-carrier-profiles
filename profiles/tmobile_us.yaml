version: 3
kind: carrier_bundle
id: apple_tmobile_us
bundle: TMobile_US.bundle
supported_plmns:
    - "310160"
    - "310200"
    - "310210"
    - "310220"
    - "310230"
    - "310240"
    - "310250"
    - "310260"
    - "310270"
    - "310310"
    - "310490"
    - "310660"
    - "310800"
    - "311660"
    - "311882"
common:
    apns:
        - apn: fast.t-mobile.com
          type_mask: 1081351
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv4
          domestic_roaming_ip_stack: ipv4
          xlat464_enabled: true
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv4v6
          domestic_roaming_ip_stack: ipv4v6
          always_on_pdu: true
          support_switch_over: true
          support_5g_sa_handover: true
        - apn: tmus
          tech_type_mask: 1048582
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv4
          domestic_roaming_ip_stack: ipv4
        - apn: pcweb.tmobile.com
          type_mask: 16
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv4
          domestic_roaming_ip_stack: ipv4
          xlat464_enabled: true
        - apn: sos
          type_mask: 262144
          tech_type_mask: 262144
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv4v6
          domestic_roaming_ip_stack: ipv4v6
          always_on_pdu: true
    apple:
        carrier_entitlements:
            supported_entitlements: 13172121
    e911:
        emergency_urns:
            default: urn:service:sos
        over_itech_supported: false
    entitlement:
        entitlement_url: https://eas3.msg.t-mobile.com
    ims:
        apn: ims
        epdg:
            address: ss.epdg.epc.mnc260.mcc310.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
            timeout_seconds: 45
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            disable_switch_to_natt_port: false
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            validate_remote_certificate: false
        ip_stack: ipv4v6
        media:
            codecs:
                - payload_type: 127
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-13.2; bw=nb-swb; ch-aw-recv=2
            enable_incoming_dtmf: true
            evs_hard_bw_limit: nb-swb
            preferred_amr_wb_mode: 8
            rtcp_inactivity_seconds: 30
            rtp_inactivity_seconds: 30
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params: []
                always_add_sip_instance: true
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: required
            re_register_on:
                - method: INVITE
                  statuses:
                    - "403"
            require_preconditions_when_mandatory: false
            sip_timers:
                EmergencyInviteResponseTimeout: 5000
                F: 30000
                InviteResponseTimeout: 0
            support_p_early_media: true
        ussi:
            enabled: true
            response_timeout_milliseconds: 20000
        volte:
            enable_volte_by_default: true
selector_overrides:
    "310310":
        apple:
            carrier_entitlements:
                supported_entitlements: 33049
        e911:
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://eas3.msg.lab.t-mobile.com
        ims:
            epdg:
                address: epdg.epc.mnc310.mcc310.pub.3gppnetwork.org
