version: 3
kind: carrier_bundle
id: apple_hutchison_uk
bundle: Hutchison_uk.bundle
supported_plmns:
    - "23420"
common: {}
plmn_overrides:
    "23420":
        apple:
            carrier_entitlements:
                supported_entitlements: 4207617
        entitlement:
            entitlement_url: https://esim-es-open-prod-tuk.esimcloud.net/tuk/prod/executeAppleActions
        ims:
            apn: ims
            ip_stack: ipv6
            ike:
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha256
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: anonymous@nai.epc.mnc020.mcc234.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
