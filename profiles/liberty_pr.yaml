version: 3
kind: carrier_bundle
id: apple_liberty_pr
bundle: Liberty_pr.bundle
supported_plmns:
    - "313790"
plmn_overrides:
    "313790":
        apns:
            - apn: internet
              type_mask: 32771
              tech_type_mask: 3
              allowed_ip_stack: ipv4v6
            - apn: mms
              type_mask: 4
              tech_type_mask: 4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv4v6
              support_switch_over: true
              support_5g_sa_handover: true
              use_network_mtu: true
            - apn: hotspot
              type_mask: 16
              allowed_ip_stack: ipv4v6
            - apn: hos
              type_mask: 1048576
              tech_type_mask: 1048576
              allowed_ip_stack: ipv4v6
              support_switch_over: false
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4v6
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 11673
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://ses.mnc790.mcc313.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.mnc790.mcc313.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: Certificate
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          protocol: esp
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                local_identifier: anonymous@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                username: 0$imsi@nai.epc.mnc$MNC.mcc$MCC.3gppnetwork.org
                remote_certificate_authority_name: GoDaddy TLS Root CA - R1
                remote_certificate_hostname: epdg.epc.mnc860.mcc354.pub.3gppnetwork.org
                validate_remote_certificate: true
            register:
                use_ipsec: true
                expires: 3600
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: false
                early_media_needs_header: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                additional_headers:
                    - selector: INVITE[wifi,911]
                      headers:
                        - 'P-Emergency-Info: IEEE-802.11b;i-wlan-node-id=${DEVICE_REF_ID}'
                        - 'Supported: geolocation'
            media:
                codecs:
                    - payload_type: 96
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-wb; ch-aw-recv=0
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 20
                enable_incoming_dtmf: true
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
