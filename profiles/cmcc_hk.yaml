version: 3
kind: carrier_bundle
id: apple_cmcc_hk
bundle: CMCC_hk.bundle
supported_plmns:
    - "45412"
plmn_overrides:
    "45412":
        apple:
            carrier_entitlements:
                supported_entitlements: 1153
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://ses.hk.chinamobile.com
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                sip_timers:
                    F: 30000
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
