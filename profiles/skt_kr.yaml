version: 3
kind: carrier_bundle
id: apple_skt_kr
bundle: SKT_kr.bundle
supported_plmns:
    - "45005"
plmn_overrides:
    "45005":
        apns:
            - apn: 5g.sktelecom.com
              type_mask: 4227077
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              always_on_pdu: true
              xlat464_enabled: true
            - apn: ims
              type_mask: 131072
              allowed_ip_stack: ipv4v6
              always_on_pdu: true
              support_5g_sa_handover: true
            - apn: tethering.sktelecom.com
              type_mask: 48
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              always_on_pdu: true
              xlat464_enabled: true
            - apn: 5g.sktelecom.com
              type_mask: 4227125
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
              xlat464_enabled: true
        apple:
            carrier_entitlements:
                supported_entitlements: 9233
        entitlement:
            entitlement_url: https://entitlements-prod.sktdns.com
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 3000
                preconditions: unsupported
                support_p_early_media: false
                early_media_needs_header: false
                re_register_on:
                    - method: INVITE
                      statuses:
                        - "408"
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "404"
                        - "414"
                        - "499"
                        - "606"
                require_preconditions_when_mandatory: false
                sip_timers:
                    B: 8000
                    D: 32000
                    F: 44000
                    H: 36000
                    InviteResponseTimeout: 5000
                    J: 32000
            media:
                codecs:
                    - payload_type: 110
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=9.6-24.4; bw=nb-swb
                telephone_event_pt_8k: 101
                telephone_event_pt_16k: 103
                packet_alignment_amr_nb: octetAlignedOnly
                packet_alignment_amr_wb: octetAlignedOnly
                payload_type_be_amr_nb: 105
                payload_type_oa_amr_nb: 98
                payload_type_be_amr_wb: 106
                payload_type_oa_amr_wb: 100
                rtcp_inactivity_seconds: 36000
                rtcp_interval_seconds: 3
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
