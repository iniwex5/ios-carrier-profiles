version: 3
kind: carrier_bundle
id: apple_bell_virgin_ca
bundle: Bell_Virgin_ca.bundle
supported_plmns:
    - "302610"
plmn_overrides:
    "302610":
        apns:
            - apn: pda2.bell.ca
              type_mask: 1081399
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv4
              use_network_mtu: true
              xlat464_enabled: true
            - apn: apps.bell.ca
              tech_type_mask: 1048582
              allowed_ip_stack: ipv4
              roaming_ip_stack: ipv4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              roaming_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
        apple:
            carrier_entitlements:
                supported_entitlements: 4205777
        e911:
            wifi_calling_without_entitlement: false
        entitlement:
            entitlement_url: https://egw.wireless.bell.ca/ium-OEMInterface/servlet/IUMServlet/
        ims:
            apn: ims
            ip_stack: ipv6
            domain: ims.bell.ca
            impi_format: imsi@carrierDomain
            epdg:
                address: epdg.epc.mnc610.mcc302.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha1
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "408"
                        - "480"
                        - "488"
                        - "500"
                        - "504"
                        - "600"
                        - "606"
                        - "503"
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                sip_timers:
                    InviteResponseTimeout: 5000
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=13.2-24.4; bw=nb-swb; ch-aw-recv=2
                mode_set_amr_wb: 0,1,2
                rtp_inactivity_seconds: 30
                rtcp_interval_seconds: 5
                max_redundancy: 220
                enable_incoming_dtmf: true
                evs_hard_bw_limit: nb-swb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
