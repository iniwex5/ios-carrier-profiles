version: 3
kind: carrier_bundle
id: apple_vodafone_tr
bundle: Vodafone_tr.bundle
supported_plmns:
    - "28602"
plmn_overrides:
    "28602":
        apns:
            - apn: internet
              type_mask: 32817
              allowed_ip_stack: ipv4v6
              roaming_ip_stack: ipv4
              xlat464_enabled: true
            - apn: mms
              username: vodafone
              password: vodafone
              type_mask: 4
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              support_switch_over: true
              support_5g_sa_handover: true
              allow_no_dns: 1
        apple:
            carrier_entitlements:
                supported_entitlements: 41985
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://es-tr.vodafone.com.tr/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            epdg:
                address: epdg.epc.mnc002.mcc286.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes128
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1300
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-swb; ch-aw-recv=3; cmr=-1
                rtcp_interval_seconds: 5
                max_redundancy: 220
                evs_hard_bw_limit: nb-swb
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
