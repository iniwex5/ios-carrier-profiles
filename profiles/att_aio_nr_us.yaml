version: 3
kind: carrier_bundle
id: apple_att_aio_nr_us
bundle: ATT_aio_NR_US.bundle
supported_plmns:
    - "310150"
common: {}
plmn_overrides:
    "310150":
        apple:
            carrier_entitlements:
                supported_entitlements: 4206217
        entitlement:
            entitlement_url: https://sentitlement2.mobile.att.net
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.att.net
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha256
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                re_register_on:
                    - method: REGISTER
                      statuses:
                        - "480"
                        - "500"
                        - "503"
                        - "504"
                    - method: INVITE
                      statuses:
                        - "403"
                        - "504"
                contact:
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            media:
                rtp_inactivity_seconds: 20
                rtcp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                remote_rtcp_deactivation: true
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
