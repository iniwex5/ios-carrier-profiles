version: 3
kind: carrier_bundle
id: apple_movistar_co
bundle: movistar_co.bundle
supported_plmns:
    - "21407"
    - "732123"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 8193
    entitlement:
        entitlement_url: https://entitlement.movistar.co/tf-colombia/apple
    ims:
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            preconditions: supported
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
