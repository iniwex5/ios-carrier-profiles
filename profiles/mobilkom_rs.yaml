version: 3
kind: carrier_bundle
id: apple_mobilkom_rs
bundle: mobilkom_rs.bundle
supported_plmns:
    - "22005"
plmn_overrides:
    "22005":
        apple:
            carrier_entitlements:
                supported_entitlements: 5121
        entitlement:
            entitlement_url: https://esim-es-open-prod-aoners.esimcloud.net/aoners/prod/executeAppleActions
        ims:
            register:
                use_ipsec: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
            volte:
                enable_volte_by_default: true
