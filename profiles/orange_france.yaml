version: 3
kind: carrier_bundle
id: apple_orange_france
bundle: Orange_France.bundle
supported_plmns:
    - "20801"
    - "20802"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4236497
    entitlement:
        entitlement_url: https://aes.orange.fr/aes
    ims:
        apn: ims
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 80000
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        ip_stack: ipv4v6
        media:
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "408"
                    - 5XX
            preconditions: supported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "20802":
        ims:
            epdg:
                address: epdg.epc.mnc001.mcc208.pub.3gppnetwork.org
