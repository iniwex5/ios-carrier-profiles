version: 3
kind: carrier_bundle
id: apple_vinaphone_vn
bundle: VinaPhone_vn.bundle
supported_plmns:
    - "45202"
plmn_overrides:
    "45202":
        apple:
            carrier_entitlements:
                supported_entitlements: 9233
        e911:
            over_itech_supported: true
            wifi_calling_without_entitlement: true
            emergency_urns:
                "113": urn:service:sos.police
                "114": urn:service:sos.fire
                "115": urn:service:sos.ambulance
        entitlement:
            entitlement_url: https://aes.mnc002.mcc452.pub.3gppnetwork.org
        ims:
            apn: ims
            ip_stack: ipv4v6
            domain: ims.mnc002.mcc452.3gppnetwork.org
            impi_format: imsi@carrierDomain
            impu_format: imsi@carrierDomain
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 43200
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                ipsec_mtu: 1280
                dpd:
                    enabled: true
                    interval_seconds: 600
                    max_retries: 5
                    retry_interval_seconds: 5
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 43200
                    lifetime_seconds: 43200
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 43200
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1280
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "403"
                        - "500"
                        - "503"
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                sip_timers:
                    B: 32000
                    D: 32000
                    F: 32000
                    H: 32000
                    InviteResponseTimeout: 30000
                    J: 32000
                    T1: 2000
                    T2: 16000
                    T4: 17000
            media:
                rtcp_inactivity_seconds: 36000
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
