version: 3
kind: carrier_bundle
id: apple_movistar_pa
bundle: movistar_pa.bundle
supported_plmns:
    - "21407"
    - "71402"
    - "71420"
common:
    apns:
        - apn: internet.tigo.pa
          type_mask: 49
          allowed_ip_stack: ipv4
        - apn: ims
          type_mask: 131072
          allowed_ip_stack: ipv4
        - apn: sos
          type_mask: 262144
          allowed_ip_stack: ipv4
    e911:
        emergency_urns:
            "103": urn:service:sos.fire
            "104": urn:service:sos.police
            "911": urn:service:sos.ambulance
    ims:
        apn: ims
        ip_stack: ipv4
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.srvcc-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - "403"
                    - "500"
                    - "503"
                    - "380"
            preconditions: unsupported
        ussi:
            enabled: false
        volte:
            enable_volte_by_default: true
