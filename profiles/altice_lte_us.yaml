version: 3
kind: carrier_bundle
id: apple_altice_lte_us
bundle: Altice_LTE_US.bundle
supported_plmns:
    - "20809"
    - "313390"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 153
    e911:
        emergency_urns:
            default: urn:service:sos
        over_itech_supported: false
    entitlement:
        entitlement_url: https://esrv.mnc390.mcc313.pub.3gppnetwork.org/entitlement/
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
            validate_remote_certificate: false
        ip_stack: ipv4
        media:
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            additional_headers:
                - selector: INVITE[wifi,911]
                  headers:
                    - 'Supported: geolocation'
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            early_media_needs_header: false
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                AckReceiveTimeout: 32000
                AckRetransmitTimer: 32000
                B: 32000
                D: 32000
                F: 32000
                H: 32000
                InviteResponseTimeout: 0
                J: 32000
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
plmn_overrides:
    "20809":
        ims:
            epdg:
                address: epdg.epc.mnc390.mcc313.pub.3gppnetwork.org
