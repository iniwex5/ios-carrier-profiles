version: 3
kind: carrier_bundle
id: apple_pccw_hk
bundle: PCCW_hk.bundle
supported_plmns:
    - "45416"
    - "45419"
    - "45420"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 109585
    entitlement:
        entitlement_url: https://sdeweb.hkcsl.com/acme/api/
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc019.mcc454.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: modp2048
                      lifetime_seconds: 80000
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        ip_stack: ipv6
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
            max_udp_message_size: 2000
            preconditions: unsupported
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "45419":
        ims:
            epdg:
                address: null
