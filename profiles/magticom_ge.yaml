version: 3
kind: carrier_bundle
id: apple_magticom_ge
bundle: Magticom_ge.bundle
supported_plmns:
    - "28202"
plmn_overrides:
    "28202":
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
