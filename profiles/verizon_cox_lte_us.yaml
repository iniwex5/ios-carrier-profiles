version: 3
kind: carrier_bundle
id: apple_verizon_cox_lte_us
bundle: Verizon_Cox_LTE_US.bundle
supported_plmns:
    - "310590"
    - "310599"
    - "311480"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4203929
    e911:
        emergency_urns:
            "922": 922@vzims.com
        over_itech_supported: false
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://spc.myvzw.com/ium-RoadrunnerInterface/servlet/IUMServlet
    ims:
        apn: ims
        epdg:
            candidates:
                - address: wo.vzwwo.com
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
            timeout_seconds: 30
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      protocol: esp
                      esn: auto
                      install_policies: true
                      secure_rekey: false
                      lifetime_seconds: 86400
            disable_switch_to_natt_port: true
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$impi_user@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 20
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        signaling:
            additional_headers:
                - selector: INVITE[911,wifi]
                  headers:
                    - 'P-com.ServiceType: Static-Emergency'
                - selector: ACK,BYE,CANCEL,REGISTER,PRACK,SUBSCRIBE,INFO,REFER,MESSAGE,UPDATE,OPTIONS,INVITE:*[wifi]
                  headers:
                    - 'P-com.Service: ARC'
                - selector: INVITE[wifi]
                  headers:
                    - 'Security-Verify: sdes-srtp;mediasec'
                    - 'Proxy-Require: mediasec'
                    - 'P-com.Service: ARC'
            contact:
                additional_contact_params:
                    - selector: REGISTER:*
                      params: []
                    - selector: REGISTER
                      params:
                        - +g.3gpp.smsip
                        - q=0.5
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "503"
            early_media_needs_header: true
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            sip_timers:
                D: 128000
                F: 30000
                InviteResponseTimeout: 10000
                T1: 3000
                T2: 16000
                T4: 17000
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
