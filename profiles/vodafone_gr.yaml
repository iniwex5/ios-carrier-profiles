version: 3
kind: carrier_bundle
id: apple_vodafone_gr
bundle: Vodafone_gr.bundle
supported_plmns:
    - "20205"
common: {}
plmn_overrides:
    "20205":
        apple:
            carrier_entitlements:
                supported_entitlements: 13440
        entitlement:
            entitlement_url: https://gr-prod.entitlement.vodafone.com:4448/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp1024
                      lifetime_seconds: 3600
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp1024
                          lifetime_seconds: 3600
                    lifetime_seconds: 3600
                sa_lifetime_seconds: 3600
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - 5XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
