version: 3
kind: carrier_bundle
id: apple_rakuten_jp
bundle: Rakuten_jp.bundle
supported_plmns:
    - "20801"
    - "44011"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 11265
    e911:
        emergency_urns:
            "110": urn:service:sos.police
            "118": urn:service:sos.marine
            "119": urn:service:sos.fire
    entitlement:
        entitlement_url: https://entitlement.devicem.rm-n.jp/entitlement/
    ims:
        apn: ims
        ip_stack: ipv4v6
        media:
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 15
        register:
            use_ipsec: true
        signaling:
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                B: 3000000
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
