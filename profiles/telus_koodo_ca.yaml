version: 3
kind: carrier_bundle
id: apple_telus_koodo_ca
bundle: Telus_Koodo_ca.bundle
supported_plmns:
    - "302220"
    - "302221"
    - "302222"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 4203697
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: false
    entitlement:
        entitlement_url: https://ent.telus.com/acmegw
    ims:
        apn: ims
        epdg:
            candidates:
                - address: epdg.epc.mnc220.mcc302.pub.3gppnetwork.org
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes128
                      integrity:
                        - sha1
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha1
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        ip_stack: ipv6
        media:
            rtcp_inactivity_seconds: 30
            rtp_inactivity_seconds: 30
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
                    - "406"
                    - "414"
                    - "499"
                    - "500"
                    - "501"
                    - "502"
                    - "503"
                    - "504"
                    - "505"
                    - "513"
                    - "580"
                    - "606"
            early_media_needs_header: false
            max_udp_message_size: 1200
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                B: 8000
                F: 16000
                InviteResponseTimeout: 5000
            support_p_early_media: false
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
plmn_overrides:
    "302220":
        ims:
            epdg:
                candidates: null
