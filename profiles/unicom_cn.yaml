version: 3
kind: carrier_bundle
id: apple_unicom_cn
bundle: Unicom_cn.bundle
supported_plmns:
    - "46001"
    - "46006"
    - "46009"
    - "46010"
common:
    apns:
        - apn: 3gnet
          type_mask: 1081395
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4
        - apn: 3gwap
          type_mask: 4
        - apn: ims
          type_mask: 131072
          allowed_ip_stack: ipv6
          wait_for_bring_up_complete: true
        - apn: 3gnet
          type_mask: 1048624
    apple:
        carrier_entitlements:
            supported_entitlements: 3073
    entitlement:
        entitlement_url: https://es.10010.com
    ims:
        apn: ims
        ip_stack: ipv6
        media:
            preferred_amr_wb_mode: 8
            rtcp_inactivity_seconds: 30
            rtp_inactivity_seconds: 20
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                always_add_sip_instance: true
            csfb_on:
                - method: INVITE
                  statuses:
                    - "503"
                    - "500"
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
