version: 3
kind: carrier_bundle
id: apple_aliv_bs
bundle: Aliv_bs.bundle
supported_plmns:
    - "36449"
    - "20809"
common:
    apns:
        - apn: pda.newcomobile.com
          type_mask: 1081397
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
        - apn: ims
          type_mask: 131072
          allowed_ip_stack: ipv4
          allow_no_dns: 1
        - apn: sos
          type_mask: 262144
          allowed_ip_stack: ipv4
    apple:
        carrier_entitlements:
            supported_entitlements: 1041
    e911:
        emergency_urns:
            <EmergencyURNsItem>: urn:service:sos
    entitlement:
        entitlement_url: https://aliv.entitlements.io3.com
    ims:
        apn: ims
        ip_stack: ipv4
        media:
            preferred_amr_wb_mode: 8
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            early_media_needs_header: false
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: false
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
