version: 3
kind: carrier_bundle
id: apple_aliv_bs
bundle: Aliv_bs.bundle
supported_plmns:
    - "20809"
    - "36449"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 1041
    entitlement:
        entitlement_url: https://aliv.entitlements.io3.com
    ims:
        apn: ims
        ip_stack: ipv4
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            preconditions: supported
            support_p_early_media: false
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
