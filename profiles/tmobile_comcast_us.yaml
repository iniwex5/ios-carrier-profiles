version: 3
kind: carrier_bundle
id: apple_tmobile_comcast_us
bundle: TMobile_Comcast_US.bundle
supported_plmns:
    - "310240"
plmn_overrides:
    "310240":
        apple:
            carrier_entitlements:
                supported_entitlements: 4205977
        e911:
            over_itech_supported: false
            emergency_urns:
                default: urn:service:sos
        entitlement:
            entitlement_url: https://eas3.msg.t-mobile.com
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                candidates:
                    - address: ss.epdg.epc.mnc260.mcc310.pub.3gppnetwork.org
                      ip_family: ipv4v6
                      source: uicc
                      priority: 20
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                disable_switch_to_natt_port: false
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 1200
                preconditions: required
                support_p_early_media: true
                early_media_needs_header: true
                re_register_on:
                    - method: INVITE
                      statuses:
                        - "403"
                require_preconditions_when_mandatory: false
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params: []
                sip_timers:
                    EmergencyInviteResponseTimeout: 5000
                    F: 30000
                    InviteResponseTimeout: 0
            media:
                rtp_inactivity_seconds: 30
            ussi:
                enabled: true
                response_timeout_milliseconds: 20000
            volte:
                enable_volte_by_default: true
