version: 3
kind: carrier_bundle
id: apple_ora_pf
bundle: Ora_pf.bundle
supported_plmns:
    - "20801"
    - "54705"
common:
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: true
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        ip_stack: ipv4
        register:
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            early_media_needs_header: false
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
plmn_overrides:
    "20801":
        ims:
            epdg:
                candidates:
                    - address: epdg.epc.mnc005.mcc547.pub.3gppnetwork.org
                      ip_family: ipv4
                      source: uicc
                      priority: 20
