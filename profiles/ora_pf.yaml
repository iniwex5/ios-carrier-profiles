version: 3
kind: carrier_bundle
id: apple_ora_pf
bundle: Ora_pf.bundle
supported_plmns:
    - "54705"
    - "20801"
common:
    apns:
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv4
          support_switch_over: true
        - apn: internet
          type_mask: 1048625
          tech_type_mask: 1048576
          allowed_ip_stack: ipv4
        - apn: SOS
          type_mask: 262144
          allowed_ip_stack: ipv4v6
          allow_no_dns: 1
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc005.mcc547.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: true
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
        ip_stack: ipv4
        media:
            codecs:
                - payload_type: 112
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=9.6-24.4; bw=nb-wb; ch-aw-recv=2
        register:
            use_ipsec: true
        signaling:
            contact:
                always_add_sip_instance: true
            early_media_needs_header: false
            preconditions: supported
            require_preconditions_when_mandatory: false
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
