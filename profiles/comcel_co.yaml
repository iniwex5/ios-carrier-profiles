version: 3
kind: carrier_bundle
id: apple_comcel_co
bundle: Comcel_co.bundle
supported_plmns:
    - "732101"
plmn_overrides:
    "732101":
        apple:
            carrier_entitlements:
                supported_entitlements: 1041
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
            emergency_urns:
                "112": urn:service:sos.police
                "123": urn:service:sos
                "911": urn:service:sos
        entitlement:
            entitlement_url: https://aes.mnc101.mcc732.pub.3gppnetwork.org/entitlement/
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                candidates:
                    - address: epdg.ims.mnc101.mcc732.pub.3gppnetwork.org
                      source: uicc
                      priority: 20
                configuration_attributes:
                    - identifier: 16389
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: true
                    interval_seconds: 600
                    max_retries: 5
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 30
                rtcp_inactivity_seconds: 25
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
