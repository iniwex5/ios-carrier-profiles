version: 3
kind: carrier_bundle
id: apple_smartfren_id
bundle: Smartfren_id.bundle
supported_plmns:
    - "51009"
    - "51028"
    - "52505"
common:
    e911:
        over_itech_supported: false
        wifi_calling_without_entitlement: true
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc009.mcc510.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16389
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16390
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                        - aes128
                      integrity:
                        - sha512
                        - sha384
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            sa_lifetime_seconds: 80000
        ip_stack: ipv4
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
        signaling:
            contact:
                always_add_sip_instance: true
            early_media_needs_header: true
            max_udp_message_size: 1000
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 0
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
