version: 3
kind: carrier_bundle
id: apple_mobicom_mn
bundle: MobiCom_mn.bundle
supported_plmns:
    - "42899"
common: {}
plmn_overrides:
    "42899":
        ims:
            apn: ims
            ip_stack: ipv4v6
            signaling:
                preconditions: supported
                support_p_early_media: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "403"
                        - "500"
                        - "503"
                        - "380"
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                            - +g.3gpp.mid-call
            media:
                rtp_inactivity_seconds: 30
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
