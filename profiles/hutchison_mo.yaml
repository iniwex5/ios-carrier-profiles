version: 3
kind: carrier_bundle
id: apple_hutchison_mo
bundle: Hutchison_mo.bundle
supported_plmns:
    - "45503"
    - "45505"
common:
    ims:
        apn: ims
        epdg:
            address: wlan.three.com.mo
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha1
                      rekey_pfs_group: modp1024
                      lifetime_seconds: 80000
            dpd:
                enabled: false
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha1
                  prf:
                    - sha1
                  dh_groups:
                    - modp1024
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
        media:
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - 3XX
                    - 4XX
                    - 5XX
                    - 6XX
            max_udp_message_size: 1200
            preconditions: unsupported
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
