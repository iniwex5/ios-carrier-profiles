version: 3
kind: carrier_bundle
id: apple_tmobile_germany
bundle: TMobile_Germany.bundle
supported_plmns:
    - "26201"
    - "26206"
    - "26278"
    - "26298"
common:
    apns:
        - apn: internet.v6.telekom
          username: telekom
          password: telekom
          type_mask: 32817
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4
          xlat464_enabled: true
        - apn: ims
          type_mask: 131072
          tech_type_mask: 131072
          allowed_ip_stack: ipv6
          roaming_ip_stack: ipv6
          support_switch_over: true
          support_5g_sa_handover: true
          no_cellular_reconnect_cause_codes:
            - cause_codes:
                - 30
                - 33
              recovers_on_airplane_mode: true
              num_tries_allowed: 2
              type: 3GPP
              timeout: 86400
        - apn: hos
          type_mask: 1048578
          tech_type_mask: 1048578
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4
          xlat464_enabled: true
    apple:
        carrier_entitlements:
            supported_entitlements: 12696577
    e911:
        emergency_urns:
            "110": urn:service:sos.police
            "112": urn:service:sos.fire
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://entitlement.telekom.de
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc001.mcc262.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 20
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 21
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 64800
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 2
                  lifetime_seconds: 64800
                  authentication_method: None
                  eap_method: EAP-AKA
            validate_remote_certificate: false
        ip_stack: ipv6
        media:
            codecs:
                - payload_type: 109
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=5.9-24.4; bw=nb-wb; ch-aw-recv=-1; cmr=1
            dtmf_digit_duration_ms: 255
            evs_hard_bw_limit: nb-wb
            include_evs_io_modes: true
            mode_set_amr_wb: 0,1,2
            rtcp_inactivity_seconds: 180
            rtcp_interval_seconds: 5
            rtp_inactivity_seconds: 20
        register:
            include_cellular_network_info: true
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*[primary]
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            early_media_needs_header: true
            preconditions: supported
            require_preconditions_when_mandatory: false
            sip_timers:
                InviteResponseTimeout: 4000
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
