version: 3
kind: carrier_bundle
id: apple_freedommobile_ca
bundle: FreedomMobile_ca.bundle
supported_plmns:
    - "302490"
common: {}
plmn_overrides:
    "302490":
        apple:
            carrier_entitlements:
                supported_entitlements: 4203665
        entitlement:
            entitlement_url: https://deg.freedommobile.ca/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv6
            domain: ims.freedommobile.ca
            impi_format: imsi@carrierDomain
            impu_format: msisdn@carrierDomain
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                include_cellular_network_info: false
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                        - "403"
                        - "404"
                        - "406"
                        - "407"
                        - "408"
                        - "480"
                        - "481"
                        - "500"
                        - "503"
                        - "580"
                        - "603"
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 30
                rtcp_interval_seconds: 5
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
