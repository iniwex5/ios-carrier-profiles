version: 3
kind: carrier_bundle
id: apple_vodafone_de
bundle: Vodafone_de.bundle
supported_plmns:
    - "26202"
plmn_overrides:
    "26202":
        apns:
            - apn: web.vodafone.de
              type_mask: 1081395
              allowed_ip_stack: ipv4v6
            - apn: ims
              type_mask: 131072
              tech_type_mask: 131072
              allowed_ip_stack: ipv6
              support_switch_over: true
              support_5g_sa_handover: true
            - apn: sos
              type_mask: 262144
              tech_type_mask: 262144
              allowed_ip_stack: ipv4v6
              support_switch_over: true
        apple:
            carrier_entitlements:
                supported_entitlements: 109568
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
        entitlement:
            entitlement_url: https://es-de.vodafone.com:4445/ium-OEMInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.epc.mnc002.mcc262.pub.3gppnetwork.org
                dns_servers:
                    - "176.9.93.198"
                    - "84.200.70.40"
                configuration_attributes:
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 14400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                preconditions: supported
                support_p_early_media: true
                early_media_needs_header: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                require_qos_before_ringing: true
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                codecs:
                    - payload_type: 109
                      name: EVS
                      clock_rate: 16000
                      channels: 1
                      fmtp: br=5.9-24.4; bw=nb-wb; ch-aw-recv=2; cmr=-1
                preferred_amr_wb_mode: 8
                rtp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
                max_redundancy: 220
                evs_hard_bw_limit: nb-wb
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: false
