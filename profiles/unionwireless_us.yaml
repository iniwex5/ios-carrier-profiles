version: 3
kind: carrier_bundle
id: apple_unionwireless_us
bundle: UnionWireless_US.bundle
supported_plmns:
    - "310020"
plmn_overrides:
    "310020":
        ims:
            apn: ims
            ip_stack: ipv4v6
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: supported
                support_p_early_media: true
                contact:
                    always_add_sip_instance: true
                additional_headers:
                    - selector: INVITE[911,wifi]
                      headers:
                        - 'Supported: geolocation'
                sip_timers:
                    InviteResponseTimeout: 5000
            media:
                rtp_inactivity_seconds: 10
            volte:
                enable_volte_by_default: true
