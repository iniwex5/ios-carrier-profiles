version: 3
kind: carrier_bundle
id: apple_cmcc_hkbn_hk
bundle: CMCC_HKBN_hk.bundle
supported_plmns:
    - "45412"
common: {}
plmn_overrides:
    "45412":
        apple:
            carrier_entitlements:
                supported_entitlements: 129
        entitlement:
            entitlement_url: https://ses.hk.chinamobile.com
        ims:
            apn: ims
            ip_stack: ipv4
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "380"
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
            volte:
                enable_volte_by_default: true
