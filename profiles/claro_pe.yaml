version: 3
kind: carrier_bundle
id: apple_claro_pe
bundle: Claro_pe.bundle
supported_plmns:
    - "71610"
common: {}
plmn_overrides:
    "71610":
        apple:
            carrier_entitlements:
                supported_entitlements: 1041
        entitlement:
            entitlement_url: https://aes.mnc010.mcc716.pub.3gppnetwork.org:44314/entitlement/
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.ims.mnc010.mcc716.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16389
                      name: AssignedPCSCFIPv4
                      type: v4
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 87000
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 87000
            register:
                use_ipsec: true
            signaling:
                max_udp_message_size: 1300
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 30
                rtcp_inactivity_seconds: 25
            volte:
                enable_volte_by_default: true
