version: 3
kind: carrier_bundle
id: apple_smart_kh
bundle: Smart_kh.bundle
supported_plmns:
    - "45602"
    - "45605"
    - "45606"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 1
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://es.smart.com.kh
    ims:
        apn: ims
        epdg:
            address: epdg.epc.mnc006.mcc456.pub.3gppnetwork.org
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - encryption:
                        - aes128
                      integrity:
                        - sha256
                      protocol: esp
                      rekey_pfs_group: modp2048
                      lifetime_seconds: 80000
                replay_window_size: 12
            disable_switch_to_natt_port: true
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            local_identifier_type: IDUserFQDN
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes128
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
            preconditions: required
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: true
plmn_overrides:
    "45606":
        ims:
            epdg:
                address: null
