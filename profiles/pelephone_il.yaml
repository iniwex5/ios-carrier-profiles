version: 3
kind: carrier_bundle
id: apple_pelephone_il
bundle: Pelephone_il.bundle
supported_plmns:
    - "20404"
    - "42503"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 13329
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://esim-es-open-prod-pelephone.esimcloud.net/pelephone/prod/executeAppleActions
    ims:
        apn: ims
        epdg:
            configuration_attributes:
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      protocol: esp
                      rekey_pfs_group: modp2048
                      lifetime_seconds: 86400
                replay_window_size: 12
            dpd:
                enabled: true
                interval_seconds: 600
                max_retries: 5
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        ip_stack: ipv6
        media:
            rtp_inactivity_seconds: 15
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
            early_media_needs_header: true
            preconditions: supported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "500"
                    - "503"
            require_preconditions_when_mandatory: false
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
plmn_overrides:
    "20404":
        ims:
            epdg:
                address: epdg.epc.mnc003.mcc425.pub.3gppnetwork.org
