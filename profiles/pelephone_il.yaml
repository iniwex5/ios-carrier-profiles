version: 3
kind: carrier_bundle
id: apple_pelephone_il
bundle: Pelephone_il.bundle
supported_plmns:
    - "20404"
    - "42503"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 13329
    entitlement:
        entitlement_url: https://esim-es-open-prod-pelephone.esimcloud.net/pelephone/prod/executeAppleActions
    ims:
        apn: ims
        ike:
            child_sa:
                lifetime_seconds: 86400
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      pfs_group: modp2048
                      lifetime_seconds: 86400
            dpd:
                enabled: true
                interval_seconds: 600
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            nat_keepalive_enabled: true
            nat_keepalive_seconds: 20
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - modp2048
                  lifetime_seconds: 86400
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 86400
        ip_stack: ipv6
        media:
            rtp_inactivity_seconds: 15
        register:
            use_ipsec: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
                        - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
            preconditions: supported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "500"
                    - "503"
            support_p_early_media: true
        volte:
            enable_volte_by_default: true
plmn_overrides:
    "20404":
        ims:
            epdg:
                address: epdg.epc.mnc003.mcc425.pub.3gppnetwork.org
