version: 3
kind: carrier_bundle
id: apple_lgu_kr
bundle: LGU_kr.bundle
supported_plmns:
    - "45006"
    - "45010"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 9233
    e911:
        emergency_urns:
            "111": urn:service:sos.country-specific.kr.111
            "112": urn:service:sos.police
            "113": urn:service:sos.country-specific.kr.113
            "117": urn:service:sos.country-specific.kr.117
            "118": urn:service:sos.country-specific.kr.118
            "119": urn:service:sos.fire
            "122": urn:service:sos.marine
            "125": urn:service:sos.country-specific.kr.125
            "911": urn:service:sos.fire
    entitlement:
        entitlement_url: https://entitlement.uplus.co.kr
    ims:
        apn: ims
        ip_stack: ipv4v6
        media:
            rtcp_inactivity_seconds: 36000
            rtcp_interval_seconds: 3
        register:
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
            max_udp_message_size: 3000
            preconditions: unsupported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "403"
            sip_timers:
                A: 2000
                B: 32000
                C: 120000
                D: 128000
                E: 2000
                F: 16000
                G: 2000
                H: 32000
                I: 9000
                InviteResponseTimeout: 0
                J: 128000
                K: 9000
                T1: 2000
                T2: 8000
                T4: 9000
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
