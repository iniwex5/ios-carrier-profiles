version: 3
kind: carrier_bundle
id: apple_lgu_kr
bundle: LGU_kr.bundle
supported_plmns:
    - "45006"
    - "45010"
common:
    apns:
        - apn: internet.lguplus.co.kr
          type_mask: 1081349
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          always_on_pdu: true
          xlat464_enabled: true
        - apn: IMS
          type_mask: 131072
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          always_on_pdu: true
        - apn: tethering.lguplus.co.kr
          type_mask: 48
          allowed_ip_stack: ipv4v6
          roaming_ip_stack: ipv4v6
          always_on_pdu: true
          xlat464_enabled: true
        - apn: emergency.lguplus.co.kr
          type_mask: 262144
          allowed_ip_stack: ipv4
          roaming_ip_stack: ipv4v6
    apple:
        carrier_entitlements:
            supported_entitlements: 9233
    entitlement:
        entitlement_url: https://entitlement.uplus.co.kr
    ims:
        apn: ims
        ip_stack: ipv4v6
        media:
            codecs:
                - payload_type: 110
                  name: EVS
                  clock_rate: 16000
                  channels: 1
                  fmtp: br=9.6-24.4; bw=nb-swb
            dtmf_digit_duration_ms: 140
            evs_hard_bw_limit: nb-swb
            packet_alignment_amr_nb: octetAlignedOnly
            packet_alignment_amr_wb: octetAlignedOnly
            payload_type_be_amr_nb: 98
            payload_type_be_amr_wb: 97
            payload_type_oa_amr_nb: 96
            payload_type_oa_amr_wb: 100
            preferred_amr_wb_mode: 8
            rtcp_inactivity_seconds: 36000
            rtcp_interval_seconds: 3
            telephone_event_pt_16k: 107
            telephone_event_pt_8k: 101
        register:
            use_ipsec: true
        signaling:
            csfb_on:
                - method: INVITE
                  statuses:
                    - "380"
            early_media_needs_header: false
            max_udp_message_size: 3000
            preconditions: unsupported
            re_register_on:
                - method: INVITE
                  statuses:
                    - "403"
            require_preconditions_when_mandatory: false
            sip_timers:
                A: 2000
                B: 32000
                C: 120000
                D: 128000
                E: 2000
                F: 16000
                G: 2000
                H: 32000
                I: 9000
                InviteResponseTimeout: 0
                J: 128000
                K: 9000
                T1: 2000
                T2: 8000
                T4: 9000
            support_p_early_media: false
        volte:
            enable_volte_by_default: true
