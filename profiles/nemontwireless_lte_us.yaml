version: 3
kind: carrier_bundle
id: apple_nemontwireless_lte_us
bundle: NemontWireless_LTE_US.bundle
supported_plmns:
    - "312480"
plmn_overrides:
    "312480":
        apple:
            carrier_entitlements:
                supported_entitlements: 177
        e911:
            over_itech_supported: true
        entitlement:
            entitlement_url: https://nemont.dcc.entitlements.io3.com
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdgn.epc.mnc480.mcc312.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                ipsec_mtu: 1280
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                local_identifier_type: IDUserFQDN
                remote_identifier_type: IDFQDN
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                preconditions: unsupported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - "600"
                        - "604"
                        - "606"
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
                additional_headers:
                    - selector: INVITE[911,wifi]
                      headers:
                        - 'P-Emergency-Info: IEEE-802.11b;i-wlan-node-id=${DEVICE_REF_ID}'
                        - 'Supported: geolocation'
                sip_timers:
                    InviteResponseTimeout: 5000
            media:
                rtp_inactivity_seconds: 30
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
