version: 3
kind: carrier_bundle
id: apple_hutchison_hk
bundle: Hutchison_hk.bundle
supported_plmns:
    - "45403"
    - "45404"
common:
    apple:
        carrier_entitlements:
            supported_entitlements: 11281
    e911:
        over_itech_supported: true
        wifi_calling_without_entitlement: true
    entitlement:
        entitlement_url: https://device.three.com.hk:8181/ium-OEMInterface/servlet/IUMServlet
    ims:
        apn: ims
        epdg:
            candidates:
                - address: wlan.three.com.hk
                  source: uicc
                  priority: 20
            configuration_attributes:
                - identifier: 16384
                  name: AssignedPCSCFIPv4
                  type: v4
                - identifier: 16386
                  name: AssignedPCSCFIPv6
                  type: v6
        ike:
            child_sa:
                lifetime_seconds: 80000
                proposals:
                    - source_branch: FirstChild
                      encryption:
                        - aes256
                      integrity:
                        - sha256
                      rekey_pfs_group: 14
                      esn: auto
                      install_policies: true
                      lifetime_seconds: 80000
                replay_window_size: 12
            dpd:
                enabled: false
                interval_seconds: 600
                max_retries: 4
                retry_interval_seconds: 10
            local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
            proposals:
                - encryption:
                    - aes256
                  integrity:
                    - sha256
                  prf:
                    - sha256
                  dh_groups:
                    - 14
                  lifetime_seconds: 80000
                  authentication_method: None
                  eap_method: EAP-AKA
            sa_lifetime_seconds: 80000
            validate_remote_certificate: false
        ip_stack: ipv4v6
        media:
            rtcp_interval_seconds: 5
        register:
            include_cellular_network_info: true
        signaling:
            contact:
                additional_contact_params:
                    - selector: REGISTER,INVITE,INVITE:*
                      params:
                        - +g.3gpp.mid-call
                        - +g.3gpp.srvcc-alerting
            early_media_needs_header: true
            max_udp_message_size: 1200
            preconditions: unsupported
            require_preconditions_when_mandatory: false
            require_qos_before_ringing: true
            support_p_early_media: true
        ussi:
            enabled: true
        volte:
            enable_volte_by_default: true
    roaming:
        wifi_calling_allowed: false
