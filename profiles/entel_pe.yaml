version: 3
kind: carrier_bundle
id: apple_entel_pe
bundle: Entel_pe.bundle
supported_plmns:
    - "71617"
common: {}
plmn_overrides:
    "71617":
        apple:
            carrier_entitlements:
                supported_entitlements: 525329
        entitlement:
            entitlement_url: https://aes.mnc017.mcc716.pub.3gppnetwork.org:3443/entitlement/
        ims:
            apn: ims
            ip_stack: ipv4v6
            ike:
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                include_cellular_network_info: true
            signaling:
                preconditions: unsupported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 15
            volte:
                enable_volte_by_default: true
