version: 3
kind: carrier_bundle
id: apple_umniah_jo
bundle: Umniah_jo.bundle
supported_plmns:
    - "41603"
plmn_overrides:
    "41603":
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                early_media_needs_header: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
