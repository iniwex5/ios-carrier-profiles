version: 3
kind: carrier_bundle
id: apple_thc_lte_us
bundle: THC_LTE_US.bundle
supported_plmns:
    - "311480"
common: {}
plmn_overrides:
    "311480":
        apple:
            carrier_entitlements:
                supported_entitlements: 464
        entitlement:
            entitlement_url: https://spc.myvzw.com/ium-RoadrunnerInterface/servlet/IUMServlet
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: wo.vzwwo.com
                configuration_attributes:
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                local_identifier: 0$impi_user@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 80000
            signaling:
                preconditions: unsupported
                support_p_early_media: false
                csfb_on:
                    - method: INVITE
                      statuses:
                        - "503"
            media:
                rtp_inactivity_seconds: 20
                rtcp_inactivity_seconds: 20
                rtcp_interval_seconds: 5
            volte:
                enable_volte_by_default: true
