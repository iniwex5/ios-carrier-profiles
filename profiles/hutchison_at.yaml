version: 3
kind: carrier_bundle
id: apple_hutchison_at
bundle: Hutchison_at.bundle
supported_plmns:
    - "23210"
plmn_overrides:
    "23210":
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        e911:
            over_itech_supported: false
            wifi_calling_without_entitlement: true
            emergency_urns:
                "122": urn:service:sos.fire
                "128": urn:service:sos.gas
                "133": urn:service:sos.police
                "140": urn:service:sos.mountain
                "141": urn:service:sos.medicalhelp
                "142": urn:service:sos.mental-health
                "144": urn:service:sos.ambulance
                "147": urn:service:sos.children
                "188": urn:service:sos.testnummer
        entitlement:
            entitlement_url: https://esim-3at-es-prd.ipaas.amdocs.com/3at/prd/executeAppleActions
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                address: epdg.epc.mnc010.mcc232.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha512
                      prf:
                        - sha512
                      dh_groups:
                        - 14
                      lifetime_seconds: 80000
                      authentication_method: None
                      eap_method: EAP-AKA
                dpd:
                    enabled: false
                    interval_seconds: 600
                    max_retries: 4
                    retry_interval_seconds: 10
                child_sa:
                    proposals:
                        - source_branch: FirstChild
                          encryption:
                            - aes256
                          integrity:
                            - sha512
                          protocol: esp
                          rekey_pfs_group: 14
                          esn: auto
                          install_policies: true
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                    replay_window_size: 12
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                validate_remote_certificate: false
                sa_lifetime_seconds: 80000
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1200
                support_p_early_media: true
                early_media_needs_header: false
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 20
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
        roaming:
            wifi_calling_allowed: true
