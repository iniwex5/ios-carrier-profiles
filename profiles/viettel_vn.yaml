version: 3
kind: carrier_bundle
id: apple_viettel_vn
bundle: Viettel_vn.bundle
supported_plmns:
    - "45204"
common: {}
plmn_overrides:
    "45204":
        apple:
            carrier_entitlements:
                supported_entitlements: 9217
        entitlement:
            entitlement_url: https://es.viettel.vn
        ims:
            apn: ims
            ip_stack: ipv4v6
            epdg:
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16386
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: true
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 80000
                    lifetime_seconds: 80000
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1280
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: INVITE,INVITE:*
                          params:
                            - +g.3gpp.srvcc-alerting
            media:
                rtcp_inactivity_seconds: 36000
            ussi:
                enabled: true
            volte:
                enable_volte_by_default: true
