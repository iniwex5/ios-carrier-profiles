version: 3
kind: carrier_bundle
id: apple_claro_br
bundle: Claro_br.bundle
supported_plmns:
    - "72405"
common: {}
plmn_overrides:
    "72405":
        apple:
            carrier_entitlements:
                supported_entitlements: 9233
        entitlement:
            entitlement_url: https://aes.mnc005.mcc724.pub.3gppnetwork.org/entitlement/
        ims:
            apn: ims
            ip_stack: ipv6
            epdg:
                address: epdg.ims.mnc005.mcc724.pub.3gppnetwork.org
                configuration_attributes:
                    - identifier: 16384
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 16390
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                proposals:
                    - encryption:
                        - aes256
                      integrity:
                        - sha256
                      prf:
                        - sha256
                      dh_groups:
                        - modp2048
                      lifetime_seconds: 86400
                      authentication_method: None
                      eap_method: EAP-AKA
                nat_keepalive_enabled: true
                dpd:
                    enabled: false
                    interval_seconds: 600
                child_sa:
                    proposals:
                        - encryption:
                            - aes256
                          integrity:
                            - sha256
                          rekey_pfs_group: modp2048
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                local_identifier: 0$imsi@nai.epc.mnc$mnc.mcc$mcc.3gppnetwork.org
                sa_lifetime_seconds: 86400
            register:
                use_ipsec: true
                include_cellular_network_info: true
            signaling:
                max_udp_message_size: 1300
                preconditions: supported
                support_p_early_media: true
                csfb_on:
                    - method: INVITE
                      statuses:
                        - 3XX
                        - 4XX
                        - 5XX
                        - 6XX
                contact:
                    always_add_sip_instance: true
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            media:
                rtp_inactivity_seconds: 25
                rtcp_inactivity_seconds: 25
                rtcp_interval_seconds: 5
            ussi:
                enabled: false
            volte:
                enable_volte_by_default: true
