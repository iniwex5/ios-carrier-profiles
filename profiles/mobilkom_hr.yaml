version: 3
kind: carrier_bundle
id: apple_mobilkom_hr
bundle: mobilkom_hr.bundle
supported_plmns:
    - "21910"
plmn_overrides:
    "21910":
        apple:
            carrier_entitlements:
                supported_entitlements: 13313
        entitlement:
            entitlement_url: https://esim-es-open-prod-aonehr.esimcloud.net/aonehr/prod/executeAppleActions
        ims:
            register:
                use_ipsec: true
            signaling:
                support_p_early_media: false
                early_media_needs_header: false
                require_preconditions_when_mandatory: false
                contact:
                    additional_contact_params:
                        - selector: REGISTER,INVITE,INVITE:*[primary]
                          params:
                            - +g.3gpp.mid-call
                            - +g.3gpp.srvcc-alerting
                            - +g.3gpp.ps2cs-srvcc-orig-pre-alerting
            volte:
                enable_volte_by_default: true
