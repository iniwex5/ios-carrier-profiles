version: 3
kind: carrier_bundle
id: apple_vimpelcom_ru
bundle: VimpelCom_ru.bundle
supported_plmns:
    - "25099"
common: {}
plmn_overrides:
    "25099":
        ims:
            epdg:
                configuration_attributes:
                    - identifier: 20
                      name: AssignedPCSCFIPv4
                      type: v4
                    - identifier: 21
                      name: AssignedPCSCFIPv6
                      type: v6
            ike:
                child_sa:
                    proposals:
                        - encryption:
                            - aes128
                          integrity:
                            - sha1
                          rekey_pfs_group: modp1024
                          lifetime_seconds: 86400
                    lifetime_seconds: 86400
                sa_lifetime_seconds: 80000
